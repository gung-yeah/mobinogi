<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마비노기 모바일 생활 테크트리 계산기</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0d14;
    --bg-soft:#101826;
    --panel:#121927;
    --panel-2:#172233;
    --line:#263449;
    --line-strong:#3b506e;
    --ink:#eef4ff;
    --muted:#95a4ba;
    --soft:#c8d3e3;
    --accent:#58c4b6;
    --accent-2:#e5be5f;
    --danger:#f27c7c;
    --green:#62c879;
    --blue:#73a7f2;
    --purple:#b88af0;
    --pink:#eb7ab5;
    --orange:#efad58;
    --shadow:0 18px 48px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 22% 14%, rgba(88,196,182,.13), transparent 28rem),
      radial-gradient(circle at 84% 10%, rgba(229,190,95,.12), transparent 28rem),
      linear-gradient(135deg, #08101b 0%, #0a0d14 44%, #13131d 100%);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  button,input,select{
    font:inherit;
  }
  button{
    border:0;
    color:inherit;
    cursor:pointer;
  }
  .app{
    display:grid;
    grid-template-columns:320px minmax(0,1fr);
    min-height:100vh;
  }
  .sidebar{
    position:sticky;
    top:0;
    height:100vh;
    overflow:auto;
    padding:18px;
    border-right:1px solid var(--line);
    background:rgba(12,17,27,.86);
    backdrop-filter:blur(10px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .brand-main{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .brand-mark{
    display:grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:8px;
    background:linear-gradient(135deg, rgba(88,196,182,.26), rgba(229,190,95,.18));
    border:1px solid var(--line-strong);
    font-size:22px;
  }
  h1{
    margin:0;
    font-size:20px;
    line-height:1.25;
    letter-spacing:0;
  }
  .subtitle{
    margin:2px 0 0;
    color:var(--muted);
    font-size:12px;
  }
  .control-block{
    display:grid;
    gap:10px;
    margin:14px 0;
  }
  .label{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--soft);
    font-size:12px;
    font-weight:700;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap span{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
  }
  .search{
    width:100%;
    height:40px;
    padding:0 12px 0 34px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
  }
  .search:focus,.qty-input:focus,.select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(88,196,182,.16);
  }
  .segmented,.category-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .segmented{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
  }
  .category-stage{
    display:grid;
    gap:14px;
    margin-top:16px;
  }
  .category-stage .label{
    margin-bottom:8px;
  }
  #primaryCategoryList{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    width:100%;
  }
  #secondaryCategoryList{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
  }
  .chip{
    min-height:32px;
    padding:7px 10px;
    border-radius:8px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--soft);
    font-size:12px;
    font-weight:700;
    text-align:center;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .category-list .chip{
    width:100%;
  }
  .segmented .chip{
    width:100%;
  }
  .chip[aria-pressed="true"]{
    background:rgba(88,196,182,.18);
    border-color:rgba(88,196,182,.7);
    color:var(--ink);
  }
  .membership-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:40px;
    padding:0 12px;
    border-radius:8px;
    border:1px solid rgba(88,196,182,.72);
    background:transparent;
    color:#fff;
    font-size:12px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:0;
    line-height:1;
  }
  .membership-badge.on{
    background:rgba(88,196,182,.9);
    color:#fff;
  }
  .select,.qty-input{
    width:100%;
    height:40px;
    padding:0 10px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
  }
  .qty-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    align-items:center;
  }
  .qty-row .label{
    white-space:nowrap;
  }
  .qty-control,.membership-control{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:8px;
  }
  .membership-control{
    grid-template-columns:1fr;
  }
  .target-tools{
    display:grid;
    grid-template-columns:minmax(280px,1fr) 118px;
    gap:10px;
    align-items:start;
    width:min(560px,100%);
  }
  .target-field{
    display:grid;
    gap:6px;
    color:var(--soft);
    font-size:12px;
    font-weight:800;
  }
  .target-search-wrap{
    position:relative;
  }
  .target-suggestions{
    position:absolute;
    z-index:20;
    top:calc(100% + 6px);
    left:0;
    right:0;
    max-height:320px;
    overflow:auto;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:rgba(18,25,39,.98);
    box-shadow:var(--shadow);
  }
  .target-suggestion{
    display:grid;
    grid-template-columns:28px minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
    width:100%;
    min-height:44px;
    padding:7px 8px;
    border-bottom:1px solid var(--line);
    background:transparent;
    text-align:left;
  }
  .target-suggestion:last-child{ border-bottom:0; }
  .target-suggestion:hover,.target-suggestion.active{ background:rgba(88,196,182,.13); }
  .target-suggestion img{
    width:28px;
    height:28px;
    border-radius:6px;
    object-fit:cover;
    background:var(--panel-2);
  }
  .suggestion-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
    font-weight:900;
  }
  .suggestion-meta{
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
  }
  .is-hidden{ display:none !important; }
  .recipe-list{
    display:grid;
    gap:8px;
    margin-top:10px;
  }
  .recipe-btn{
    display:grid;
    grid-template-columns:32px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:52px;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(18,25,39,.86);
    text-align:left;
  }
  .recipe-btn:hover,.recipe-btn.active{
    border-color:var(--accent);
    background:rgba(88,196,182,.13);
  }
  .item-icon{
    width:32px;
    height:32px;
    border-radius:7px;
    object-fit:cover;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,.08);
  }
  .recipe-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:800;
    font-size:13px;
  }
  .recipe-meta{
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:3px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--soft);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .main{
    min-width:0;
    padding:24px;
  }
  .topbar{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:16px;
    align-items:center;
    margin-bottom:18px;
  }
  .header-main{
    min-width:0;
  }
  .title-line{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .title-line img{
    width:48px;
    height:48px;
    border-radius:8px;
    object-fit:cover;
    border:1px solid var(--line-strong);
    background:var(--panel-2);
  }
  h2{
    margin:0;
    font-size:28px;
    line-height:1.2;
    letter-spacing:0;
  }
  .title-heading{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px 10px;
    min-width:0;
  }
  .title-heading h2{
    min-width:0;
    overflow-wrap:anywhere;
  }
  .meta-line{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:0;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .actions.compact{
    align-items:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:38px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--soft);
    font-weight:800;
    font-size:12px;
  }
  .btn.primary{
    border-color:rgba(88,196,182,.78);
    background:rgba(88,196,182,.18);
    color:var(--ink);
  }
  .btn.danger{
    border-color:rgba(242,124,124,.52);
    color:#ffd6d6;
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
    margin-bottom:16px;
  }
  .stats.time-only{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .stat{
    min-height:92px;
    padding:14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(23,34,51,.86), rgba(18,25,39,.86));
    box-shadow:var(--shadow);
  }
  .stat-label{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }
  .stat-value{
    margin-top:8px;
    font-size:23px;
    line-height:1.2;
    font-weight:900;
    overflow-wrap:anywhere;
  }
  .time-stat{
    min-height:0;
    min-width:150px;
    padding:10px 12px;
  }
  .time-stat .stat-value{
    margin-top:4px;
    font-size:15px;
  }
  .stat-note{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:16px;
    align-items:start;
  }
  .panel{
    min-width:0;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(18,25,39,.84);
    box-shadow:var(--shadow);
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .panel-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .panel-title{
    margin:0;
    font-size:15px;
    font-weight:900;
  }
  .panel-title-row{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .panel-title-row .badge{
    color:var(--accent-2);
    border-color:rgba(229,190,95,.36);
  }
  .panel-body{
    padding:14px 16px 16px;
  }
  .tree-wrap{
    min-height:390px;
    overflow:auto;
  }
  .tree-svg{
    display:block;
    min-width:760px;
    width:100%;
    height:460px;
  }
  .node-card{
    fill:#172233;
    stroke:#344864;
    stroke-width:1;
  }
  .node-card.target{
    fill:rgba(88,196,182,.26);
    stroke:#58c4b6;
  }
  .node-card.direct{
    fill:rgba(229,190,95,.18);
    stroke:#e5be5f;
    stroke-dasharray:5 4;
  }
  .node-card.highlight{
    fill:rgba(88,196,182,.32);
    stroke:#58c4b6;
    stroke-width:2;
  }
  .node-card.struck{
    fill:rgba(242,124,124,.14);
    stroke:rgba(242,124,124,.72);
  }
  .node-icon{
    pointer-events:none;
  }
  .node-text{
    fill:var(--ink);
    font-size:14px;
    font-weight:900;
  }
  .node-sub{
    fill:var(--muted);
    font-size:12px;
  }
  .node-strike{
    stroke:var(--danger);
    stroke-width:2.2;
    pointer-events:none;
  }
  .edge{
    fill:none;
    stroke:#506782;
    stroke-width:1.8;
  }
  .edge.highlight{
    stroke:#58c4b6;
    stroke-width:2.8;
  }
  .table-wrap{
    overflow:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:560px;
  }
  th,td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    text-align:left;
    vertical-align:middle;
    font-size:13px;
  }
  th{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-align:center;
  }
  td.num{
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  th.num{
    text-align:center;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .owned-input{
    width:86px;
    height:32px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    text-align:right;
    outline:none;
  }
  .material-cell{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .material-cell img{
    width:26px;
    height:26px;
    border-radius:6px;
    object-fit:cover;
    background:var(--panel-2);
  }
  .material-name{
    min-width:0;
    overflow-wrap:anywhere;
    font-weight:800;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    min-height:22px;
    padding:2px 7px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    color:var(--soft);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .tag.direct{
    color:#ffe2a0;
    border-color:rgba(229,190,95,.45);
    background:rgba(229,190,95,.1);
  }
  .tag.action{
    cursor:pointer;
  }
  .tag.crafted{
    color:#b6fff1;
    border-color:rgba(88,196,182,.42);
    background:rgba(88,196,182,.09);
  }
  .two-col{
    display:grid;
    grid-template-columns:minmax(260px,.9fr) minmax(360px,1.1fr) minmax(260px,.9fr);
    gap:16px;
  }
  .step-list,.alt-list{
    display:grid;
    gap:10px;
  }
  .step{
    display:grid;
    grid-template-columns:32px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(255,255,255,.035);
  }
  .step-title{
    font-size:13px;
    font-weight:900;
    overflow-wrap:anywhere;
  }
  .step-sub{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
  }
  .alt-item{
    display:grid;
    gap:8px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(255,255,255,.035);
  }
  .alt-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
  }
  .empty{
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
  }
  .toast{
    position:fixed;
    right:18px;
    bottom:18px;
    max-width:360px;
    padding:11px 13px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:rgba(18,25,39,.96);
    color:var(--ink);
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    font-size:13px;
  }
  .toast.show{
    opacity:1;
    transform:translateY(0);
  }
  @media (max-width:1080px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:relative;
      height:auto;
      border-right:0;
      border-bottom:1px solid var(--line);
    }
    .recipe-list{
      grid-template-columns:repeat(2,minmax(0,1fr));
      max-height:360px;
      overflow:auto;
    }
    .layout,.two-col{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .main{padding:16px}
    .topbar{grid-template-columns:1fr}
    .actions{justify-content:flex-start}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .recipe-list{grid-template-columns:1fr}
    .tree-svg{min-width:560px}
    .target-tools{grid-template-columns:minmax(0,1fr) 100px}
    h2{font-size:23px}
  }
  @media (max-width:460px){
    .stats{grid-template-columns:1fr}
    .qty-row{grid-template-columns:1fr 1fr}
    .title-line{align-items:flex-start}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-main">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <h1>생활 테크트리</h1>
          <p class="subtitle">재료, 시간, 제작 대체 계산</p>
        </div>
      </div>
    </div>

    <div class="control-block">
      <label class="label" for="searchInput"><span>아이템 검색</span><span id="resultCount"></span></label>
      <div class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input class="search" id="searchInput" type="search" autocomplete="off">
      </div>
      <div class="qty-row">
        <div class="qty-control">
          <label class="label" for="targetQty"><span>수량</span></label>
          <input class="qty-input" id="targetQty" type="number" min="1" step="1" value="1" aria-label="목표 수량">
        </div>
        <div class="membership-control">
          <button class="membership-badge on" id="membershipToggle" type="button" aria-pressed="true">멤버십 ON</button>
        </div>
      </div>
    </div>

    <div class="control-block category-stage">
      <div>
        <div class="label"><span>1차 카테고리</span></div>
        <div class="category-list" id="primaryCategoryList"></div>
      </div>
      <div>
        <div class="label"><span>2차 카테고리</span></div>
        <div class="category-list" id="secondaryCategoryList"></div>
      </div>
    </div>

    <div class="control-block">
      <div class="label"><span>표시 기준</span></div>
      <div class="segmented">
        <button class="chip" id="sortNameBtn" type="button" aria-pressed="true">이름순</button>
        <button class="chip" id="sortTimeBtn" type="button" aria-pressed="false">시간순</button>
        <button class="chip" id="sortTierBtn" type="button" aria-pressed="false">단계순</button>
      </div>
    </div>

    <div class="recipe-list" id="recipeList"></div>
  </aside>

  <main class="main">
    <section class="topbar" aria-labelledby="selectedTitle">
      <div class="header-main">
        <div class="title-line">
          <img id="selectedIcon" alt="">
          <div>
            <div class="title-heading">
              <h2 id="selectedTitle"></h2>
              <div class="meta-line" id="selectedMeta"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="actions compact">
        <button class="btn primary" id="copyBtn" type="button">제작식 복사</button>
      </div>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title-row">
            <h3 class="panel-title">제작 단계</h3>
            <span class="badge" id="statTime">0초</span>
          </div>
          <div class="panel-actions">
            <button class="btn" id="resetDirectBtn" type="button">직접 확보 초기화</button>
          </div>
        </div>
        <div class="tree-wrap">
          <svg class="tree-svg" id="treeSvg" role="img" aria-label="선택한 목표 아이템의 제작 단계"></svg>
        </div>
      </div>
    </section>

    <section class="two-col" style="margin-top:16px">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title-row">
            <h3 class="panel-title">제작 순서</h3>
            <span class="badge" id="stepBadge">0개</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="step-list" id="stepList"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title-row">
            <h3 class="panel-title">총 재료</h3>
            <span class="badge" id="rawTotalBadge">0종</span>
          </div>
        </div>
        <div class="panel-body table-wrap">
          <table>
            <thead>
              <tr>
                <th>재료</th>
                <th class="num">필요 수량</th>
                <th class="num">소유</th>
                <th class="num">부족</th>
                <th>처리</th>
              </tr>
            </thead>
            <tbody id="rawTable"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title-row">
            <h3 class="panel-title">생산 대체 방법</h3>
            <span class="badge" id="altBadge">0개</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="alt-list" id="altList"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(() => {
  const rarity = {
    silver:{name:"일반", color:"var(--soft)"},
    green:{name:"고급", color:"var(--green)"},
    blue:{name:"레어", color:"var(--blue)"},
    purple:{name:"엘리트", color:"var(--purple)"},
    pink:{name:"에픽", color:"var(--pink)"},
    orange:{name:"전설", color:"var(--orange)"}
  };
  const state = {
    query:"",
    primaryCategory:"processing",
    secondaryCategory:"metal",
    sort:"name",
    membership:true,
    selectedId:"m9",
    targetQty:5,
    navStack:[],
    direct:new Set(),
    owned:{},
    highlightKey:null,
    choices:{}
  };
  const nodeById = new Map(NODES.map(node => [node.id, node]));
  const categoryById = new Map(CATEGORIES.map(category => [category.id, category]));
  const PRIMARY_CATEGORIES = [
    { id:"processing", name:"가공", categories:["metal","wood","leather","cloth","potion","food"] },
    { id:"production", name:"제작", categories:["craft_item","cook_simple","cook_power","craft_tool"] }
  ];
  const SECONDARY_CATEGORIES = {
    processing:[
      { id:"metal", name:"금속 가공", categories:["metal"] },
      { id:"wood", name:"목재 가공", categories:["wood"] },
      { id:"leather", name:"가죽 가공", categories:["leather"] },
      { id:"cloth", name:"옷감 가공", categories:["cloth"] },
      { id:"potion", name:"약품 가공", categories:["potion"] },
      { id:"food", name:"식재료 가공", categories:["food"] }
    ],
    production:[
      { id:"craft_item", name:"아이템 제작", categories:["craft_item"] },
      { id:"cook_food", name:"음식 제작", categories:["cook_simple","cook_power"] },
      { id:"craft_tool", name:"도구 제작", categories:["craft_tool"] }
    ]
  };
  const producedKey = name => {
    const value = String(name).trim();
    const simpleAlias = value.match(/^(철괴)\(.+\)$/);
    if(simpleAlias) return simpleAlias[1];
    const crystalAlias = value.match(/^((?:광휘|불꽃|얼음|전기|봉인)의 결정)\(.+\)$/);
    if(crystalAlias) return crystalAlias[1];
    return value;
  };
  const producers = new Map();
  NODES.forEach(node => {
    const key = producedKey(node.name);
    if(!producers.has(key)) producers.set(key, []);
    producers.get(key).push(node);
  });
  const secondsOf = value => {
    if(!value) return 0;
    const h = value.match(/(\d+)\s*시간/);
    const m = value.match(/(\d+)\s*분/);
    const s = value.match(/(\d+)\s*초/);
    return (h ? Number(h[1]) * 3600 : 0) + (m ? Number(m[1]) * 60 : 0) + (s ? Number(s[1]) : 0);
  };
  const timeLabel = (node, count = 1) => {
    if(!node.time) return "즉시";
    const seconds = secondsOf(node.time) * count * (state.membership ? 1 : 2);
    return count === 1 ? formatSeconds(seconds) : formatSeconds(seconds);
  };
  const formatSeconds = value => {
    let total = Math.max(0, Math.round(value));
    const h = Math.floor(total / 3600);
    total -= h * 3600;
    const m = Math.floor(total / 60);
    const s = total - m * 60;
    const parts = [];
    if(h) parts.push(h + "시간");
    if(m) parts.push(m + "분");
    if(s || !parts.length) parts.push(s + "초");
    return parts.join(" ");
  };
  const formatNumber = value => new Intl.NumberFormat("ko-KR").format(value);
  const ICON_ALIASES = {
    "견고한 낫":"견고한 낫",
    "견고한 호미":"견고한 호미",
    "견고한 약초 괭이":"견고한 약초 괭이",
    "견고한 양털 가위":"견고한 양털 가위",
    "견고한 벌목 도끼":"견고한 벌목 도끼",
    "견고한 곡괭이":"견고한 곡괭이",
    "견고한 곤충 채집망":"견고한 곤충 채집망",
    "견고한 낚싯대":"견고한 낚싯대",
    "염색약":"환영 가루",
    "호박 수프":"호박 스프",
    "풍미 가득 스테이크":"풍미 가득 크림 스테이크"
  };
  const iconName = item => {
    const node = typeof item === "object" && item ? item : null;
    const name = node ? node.name : item;
    if(name === "최상급 붕대"){
      return node && node.yield === 5 ? "최상급 붕대5" : "최상급 붕대10";
    }
    return ICON_ALIASES[name] || name;
  };
  const iconPath = item => "icons/" + iconName(item) + ".png";
  const displayTime = (node, count = 1) => node.time ? timeLabel(node, count) : "즉시";
  const tierCache = new Map();
  const tierOf = id => {
    if(tierCache.has(id)) return tierCache.get(id);
    const node = nodeById.get(id);
    if(!node || !node.materials) return 1;
    let max = 0;
    node.materials.forEach(material => {
      const producer = pickProducer(material.name);
      if(producer && producer.id !== id) max = Math.max(max, tierOf(producer.id));
    });
    tierCache.set(id, max + 1);
    return max + 1;
  };
  const pickProducer = materialName => {
    const key = producedKey(materialName);
    const list = producers.get(key);
    if(!list || !list.length) return null;
    const chosenId = state.choices[key];
    if(chosenId) return list.find(node => node.id === chosenId) || list[0];
    return [...list].sort((a,b) => secondsOf(a.time) - secondsOf(b.time) || a.materials.length - b.materials.length)[0];
  };
  const categoryLabel = node => {
    if(["cook_simple","cook_power"].includes(node.category)) return "음식 제작";
    if(node.category === "craft_item") return "아이템 제작";
    if(node.category === "craft_tool") return "도구 제작";
    const category = categoryById.get(node.category);
    return category ? category.icon + " " + category.name : node.category;
  };
  const directAllowed = name => producers.has(producedKey(name));
  const addMap = (map, key, amount, meta) => {
    if(!map.has(key)) map.set(key, {...meta, qty:0});
    map.get(key).qty += amount;
  };
  const addCraft = (map, node, key, count, produced) => {
    if(!map.has(node.id)) map.set(node.id, {node, key, count:0, produced:0});
    const row = map.get(node.id);
    row.count += count;
    row.produced += produced;
  };
  function calculate(node, amount){
    const raw = new Map();
    const crafts = new Map();
    const visits = new Set();
    const tree = buildNeed(node, amount, true, visits, raw, crafts);
    const craftRows = [...crafts.values()].sort((a,b) => tierOf(a.node.id) - tierOf(b.node.id) || a.node.name.localeCompare(b.node.name, "ko"));
    const rawRows = [...raw.values()].sort((a,b) => b.qty - a.qty || a.name.localeCompare(b.name, "ko"));
    const totalTime = craftRows.reduce((sum,row) => sum + row.count * secondsOf(row.node.time) * (state.membership ? 1 : 2), 0);
    const unknownTimeCount = craftRows.filter(row => !row.node.time).length;
    return {tree, rawRows, craftRows, totalTime, unknownTimeCount};
  }
  function buildNeed(node, amount, isTarget, visits, raw, crafts){
    const key = producedKey(node.name);
    const count = Math.ceil(amount / node.yield);
    const produced = count * node.yield;
    const direct = !isTarget && state.direct.has(key);
    const current = {
      id:node.id,
      name:node.name,
      key,
      required:amount,
      produced,
      count,
      node,
      direct,
      children:[]
    };
    if(direct){
      addMap(raw, key, amount, {name:key, kind:"direct", source:node});
      return current;
    }
    addCraft(crafts, node, key, count, produced);
    if(visits.has(node.id)) return current;
    const nextVisits = new Set(visits);
    nextVisits.add(node.id);
    (node.materials || []).forEach(material => {
      const needed = material.qty * count;
      const producer = pickProducer(material.name);
      if(producer && producer.id !== node.id){
        current.children.push(buildNeed(producer, needed, false, nextVisits, raw, crafts));
      }else{
        addMap(raw, material.name, needed, {name:material.name, kind:"raw"});
        current.children.push({
          id:"raw-" + material.name,
          name:material.name,
          key:material.name,
          required:needed,
          produced:needed,
          count:0,
          node:null,
          direct:true,
          children:[]
        });
      }
    });
    return current;
  }
  const el = id => document.getElementById(id);
  function activeSecondary(){
    const list = SECONDARY_CATEGORIES[state.primaryCategory] || SECONDARY_CATEGORIES.processing;
    return list.find(item => item.id === state.secondaryCategory) || list[0];
  }
  function activeCategoryIds(){
    return new Set(activeSecondary().categories);
  }
  function secondaryForNode(node){
    for(const [primaryId, categories] of Object.entries(SECONDARY_CATEGORIES)){
      const secondary = categories.find(item => item.categories.includes(node.category));
      if(secondary) return {primaryId, secondaryId:secondary.id};
    }
    return null;
  }
  function syncCategoryToNode(node){
    const match = secondaryForNode(node);
    if(!match) return;
    state.primaryCategory = match.primaryId;
    state.secondaryCategory = match.secondaryId;
  }
  function nodeSearchMatches(query){
    const value = query.trim().toLowerCase();
    if(!value) return [];
    const starts = NODES.filter(node => node.name.toLowerCase().startsWith(value));
    const includes = NODES.filter(node => {
      if(starts.includes(node)) return false;
      const haystack = [node.name, categoryLabel(node), ...(node.materials || []).map(item => item.name)].join(" ").toLowerCase();
      return haystack.includes(value);
    });
    return [
      ...starts.sort((a,b) => a.name.localeCompare(b.name, "ko")),
      ...includes.sort((a,b) => a.name.localeCompare(b.name, "ko"))
    ];
  }
  function renderCategories(){
    const primaryHost = el("primaryCategoryList");
    const secondaryHost = el("secondaryCategoryList");
    primaryHost.innerHTML = "";
    secondaryHost.innerHTML = "";
    PRIMARY_CATEGORIES.forEach(category => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip";
      button.setAttribute("aria-pressed", String(state.primaryCategory === category.id));
      button.textContent = category.name;
      button.addEventListener("click", () => {
        state.primaryCategory = category.id;
        state.secondaryCategory = SECONDARY_CATEGORIES[category.id][0].id;
        state.query = "";
        el("searchInput").value = "";
        state.highlightKey = null;
        state.navStack = [];
        render();
      });
      primaryHost.appendChild(button);
    });
    SECONDARY_CATEGORIES[state.primaryCategory].forEach(category => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip";
      button.setAttribute("aria-pressed", String(state.secondaryCategory === category.id));
      button.textContent = category.name;
      button.addEventListener("click", () => {
        state.secondaryCategory = category.id;
        state.query = "";
        el("searchInput").value = "";
        state.highlightKey = null;
        state.navStack = [];
        render();
      });
      secondaryHost.appendChild(button);
    });
  }
  function filteredNodes(){
    const query = state.query.trim().toLowerCase();
    if(query){
      return nodeSearchMatches(query);
    }
    const categoryIds = activeCategoryIds();
    let list = NODES.filter(node => categoryIds.has(node.category));
    return list.sort((a,b) => {
      if(state.sort === "time") return secondsOf(a.time) - secondsOf(b.time) || a.name.localeCompare(b.name, "ko");
      if(state.sort === "tier") return tierOf(a.id) - tierOf(b.id) || a.name.localeCompare(b.name, "ko");
      return a.name.localeCompare(b.name, "ko");
    });
  }
  function renderRecipeList(list){
    const host = el("recipeList");
    host.innerHTML = "";
    el("resultCount").textContent = list.length + "개";
    list.forEach(node => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "recipe-btn" + (node.id === state.selectedId ? " active" : "");
      button.innerHTML = `
        <img class="item-icon" src="${iconPath(node)}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="recipe-name">${node.name}</div>
          <div class="recipe-meta">${categoryLabel(node)} · ${node.yield}개 생산 · ${displayTime(node)}</div>
        </div>
      `;
      button.addEventListener("click", () => {
        selectNode(node.id, { resetNavigation:true });
      });
      host.appendChild(button);
    });
    if(!list.length){
      host.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
    }
  }
  function selectNode(id, options = {}){
    const node = nodeById.get(id);
    if(!node) return;
    if(options.resetNavigation){
      state.navStack = [];
    }
    state.selectedId = node.id;
    if(options.syncCategory !== false) syncCategoryToNode(node);
    state.targetQty = Math.max(1, Number(el("targetQty").value) || node.yield || 1);
    state.direct.delete(producedKey(node.name));
    state.highlightKey = null;
    render();
  }
  function ensureSelectedMatchesCategory(){
    if(state.query.trim()) return;
    const current = nodeById.get(state.selectedId);
    const categoryIds = activeCategoryIds();
    if(current && categoryIds.has(current.category)) return;
    const next = NODES
      .filter(node => categoryIds.has(node.category))
      .sort((a,b) => a.name.localeCompare(b.name, "ko"))[0];
    if(next){
      state.selectedId = next.id;
      state.navStack = [];
    }
  }
  function renderHeader(node, result){
    el("selectedTitle").textContent = node.name;
    const icon = el("selectedIcon");
    icon.src = iconPath(node);
    icon.alt = node.name;
    icon.onerror = () => { icon.style.visibility = "hidden"; };
    icon.style.visibility = "visible";
    el("selectedMeta").innerHTML = `
      <span class="badge">${categoryLabel(node)}</span>
      <span class="badge">${node.yield}개 생산</span>
      <span class="badge">1회 ${displayTime(node)}</span>
    `;
    el("statTime").textContent = formatSeconds(result.totalTime);
  }
  function isDirectMaterial(key, required){
    return state.direct.has(key);
  }
  function renderRawRows(rows){
    const body = el("rawTable");
    body.innerHTML = "";
    el("rawTotalBadge").textContent = rows.length + "종";
    rows.forEach(row => {
      const tr = document.createElement("tr");
      const key = producedKey(row.name);
      const ownedValue = state.owned[key] ?? "";
      const ownedNumber = Math.max(0, Number(ownedValue) || 0);
      const shortage = Math.max(0, row.qty - ownedNumber);
      const isDirect = row.kind === "direct" || isDirectMaterial(key, row.qty) || ownedNumber >= row.qty;
      const produced = directAllowed(row.name);
      tr.innerHTML = `
        <td>
          <div class="material-cell">
            ${produced ? `<img src="${iconPath(row.source || row.name)}" alt="" onerror="this.remove()">` : ""}
            <span class="material-name">${row.name}</span>
          </div>
        </td>
        <td class="num">${formatNumber(row.qty)}</td>
        <td class="num"><input class="owned-input" type="number" min="0" step="1" value="${ownedValue}" aria-label="${row.name} 소유 수량"></td>
        <td class="num shortage-cell">${formatNumber(shortage)}</td>
        <td><button class="tag action ${isDirect ? "direct" : ""}" type="button">${isDirect ? "직접 확보" : "원재료 확보"}</button></td>
      `;
      tr.querySelector(".owned-input").addEventListener("input", event => {
        const value = event.target.value;
        if(value === "") delete state.owned[key];
        else state.owned[key] = Math.max(0, Math.floor(Number(value) || 0));
        const currentOwned = Math.max(0, Number(state.owned[key]) || 0);
        const currentDirect = row.kind === "direct" || state.direct.has(key) || currentOwned >= row.qty;
        tr.querySelector(".shortage-cell").textContent = formatNumber(Math.max(0, row.qty - currentOwned));
        const button = tr.querySelector(".tag.action");
        button.classList.toggle("direct", currentDirect);
        button.textContent = currentDirect ? "직접 확보" : "원재료 확보";
      });
      tr.querySelector(".tag.action").addEventListener("click", () => {
        const currentOwned = Math.max(0, Number(state.owned[key]) || 0);
        const currentDirect = row.kind === "direct" || state.direct.has(key) || currentOwned >= row.qty;
        if(currentDirect){
          state.direct.delete(key);
          delete state.owned[key];
        }else{
          state.owned[key] = row.qty;
          state.direct.add(key);
        }
        render();
      });
      body.appendChild(tr);
    });
    if(!rows.length){
      body.innerHTML = `<tr><td colspan="5" class="empty">총 재료가 없습니다.</td></tr>`;
    }
  }
  function renderSteps(rows){
    const host = el("stepList");
    host.innerHTML = "";
    el("stepBadge").textContent = rows.length + "개";
    rows.forEach(row => {
      const item = document.createElement("div");
      item.className = "step";
      item.innerHTML = `
        <img class="item-icon" src="${iconPath(row.node)}" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="step-title">${row.node.name}</div>
          <div class="step-sub">${categoryLabel(row.node)} · ${formatNumber(row.count)}회 · ${formatNumber(row.produced)}개 생산</div>
        </div>
        <span class="badge">${displayTime(row.node, row.count)}</span>
      `;
      host.appendChild(item);
    });
    if(!rows.length) host.innerHTML = `<div class="empty">제작 단계가 없습니다.</div>`;
  }
  function collectAlternativeKeys(result){
    const keys = new Set();
    const visit = tree => {
      if(!tree) return;
      if(producers.has(tree.key) && producers.get(tree.key).length > 1) keys.add(tree.key);
      tree.children.forEach(visit);
    };
    visit(result.tree);
    return [...keys].sort((a,b) => a.localeCompare(b, "ko"));
  }
  function renderAlternatives(result){
    const host = el("altList");
    host.innerHTML = "";
    const keys = collectAlternativeKeys(result);
    el("altBadge").textContent = keys.length + "개";
    keys.forEach(key => {
      const box = document.createElement("div");
      box.className = "alt-item";
      const list = producers.get(key);
      const selected = pickProducer(key);
      box.innerHTML = `
        <div class="alt-head">
          <strong>${key}</strong>
          <span class="tag crafted">${list.length}가지</span>
        </div>
        <select class="select" aria-label="${key} 생산 방법">
          ${list.map(node => `<option value="${node.id}" ${node.id === selected.id ? "selected" : ""}>${node.name} · ${node.yield}개 · ${displayTime(node)}</option>`).join("")}
        </select>
      `;
      box.querySelector("select").addEventListener("change", event => {
        state.choices[key] = event.target.value;
        render();
      });
      host.appendChild(box);
    });
    const directCandidates = result.craftRows
      .map(row => producedKey(row.node.name))
      .filter((key,index,list) => key !== producedKey(nodeById.get(state.selectedId).name) && list.indexOf(key) === index)
      .sort((a,b) => a.localeCompare(b, "ko"));
    directCandidates.slice(0, 12).forEach(key => {
      const node = pickProducer(key);
      const box = document.createElement("div");
      box.className = "alt-item";
      const isDirect = state.direct.has(key);
      box.innerHTML = `
        <div class="alt-head">
          <strong>${key}</strong>
          <span class="tag ${isDirect ? "direct" : "crafted"}">${isDirect ? "직접 확보" : "제작 포함"}</span>
        </div>
        <button class="btn ${isDirect ? "primary" : ""}" type="button">${isDirect ? "제작 계산에 다시 포함" : "보유/거래소/채집으로 직접 확보"}</button>
        <div class="step-sub">기본 생산: ${node.name} · ${displayTime(node)}</div>
      `;
      box.querySelector("button").addEventListener("click", () => {
        if(state.direct.has(key)) state.direct.delete(key);
        else state.direct.add(key);
        render();
      });
      host.appendChild(box);
    });
    if(!host.children.length){
      host.innerHTML = `<div class="empty">이 목표에는 선택 가능한 대체 생산법이나 중간재 직접 확보 후보가 없습니다.</div>`;
    }
  }
  function drawTree(tree){
    const svg = el("treeSvg");
    svg.innerHTML = "";
    const levels = [];
    const seen = new Map();
    const walk = (node, depth) => {
      if(!levels[depth]) levels[depth] = [];
      const copy = {...node, depth, uid:node.id + "-" + depth + "-" + levels[depth].length};
      levels[depth].push(copy);
      seen.set(copy.uid, copy);
      copy.childrenRefs = node.children.map(child => walk(child, depth + 1));
      return copy.uid;
    };
    const rootId = walk(tree, 0);
    const flat = [...seen.values()];
    const nodeWidth = 236;
    const nodeHeight = 68;
    const levelGap = 288;
    const rowGap = 104;
    const width = Math.max(760, levels.length * levelGap + 100);
    const height = Math.max(460, Math.max(...levels.map(list => list.length)) * rowGap + 90);
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("height", String(height));
    levels.forEach((list, depth) => {
      const gap = height / (list.length + 1);
      list.forEach((node, index) => {
        node.x = 44 + depth * levelGap;
        node.y = gap * (index + 1);
      });
    });
    const highlightedUids = new Set();
    const highlightedEdges = new Set();
    const markHighlightPath = uid => {
      const current = seen.get(uid);
      if(!current) return false;
      if(uid === state.highlightKey){
        highlightedUids.add(uid);
        return true;
      }
      for(const childId of current.childrenRefs){
        if(markHighlightPath(childId)){
          highlightedUids.add(uid);
          highlightedEdges.add(uid + ">" + childId);
          return true;
        }
      }
      return false;
    };
    if(state.highlightKey) markHighlightPath(rootId);
    flat.forEach(node => {
      node.childrenRefs.forEach(childId => {
        const child = seen.get(childId);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const x1 = node.x + nodeWidth;
        const x2 = child.x;
        const mx = (x1 + x2) / 2;
        path.setAttribute("class", "edge" + (highlightedEdges.has(node.uid + ">" + childId) ? " highlight" : ""));
        path.setAttribute("d", `M${x1},${node.y} C${mx},${node.y} ${mx},${child.y} ${x2},${child.y}`);
        svg.appendChild(path);
      });
    });
    flat.forEach(node => {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("role", "button");
      group.style.cursor = "pointer";
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", node.x);
      rect.setAttribute("y", node.y - nodeHeight / 2);
      rect.setAttribute("width", String(nodeWidth));
      rect.setAttribute("height", String(nodeHeight));
      rect.setAttribute("rx", "8");
      const isStruck = node.node && (node.direct || isDirectMaterial(node.key, node.required));
      rect.setAttribute("class", "node-card" + (node.id === state.selectedId ? " target" : "") + (node.direct && node.node ? " direct" : "") + (highlightedUids.has(node.uid) ? " highlight" : "") + (isStruck ? " struck" : ""));
      group.appendChild(rect);
      const image = document.createElementNS("http://www.w3.org/2000/svg", "image");
      const iconSize = nodeHeight - 14;
      image.setAttribute("x", node.x + 8);
      image.setAttribute("y", node.y - iconSize / 2);
      image.setAttribute("width", String(iconSize));
      image.setAttribute("height", String(iconSize));
      image.setAttribute("preserveAspectRatio", "xMidYMid slice");
      image.setAttribute("class", "node-icon");
      image.setAttribute("href", iconPath(node.node || node.key));
      image.addEventListener("error", () => image.remove());
      group.appendChild(image);
      const textX = node.x + iconSize + 18;
      const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
      title.setAttribute("x", textX);
      title.setAttribute("y", node.y - 10);
      title.setAttribute("class", "node-text");
      title.textContent = trimText(node.key, 15);
      group.appendChild(title);
      const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
      sub.setAttribute("x", textX);
      sub.setAttribute("y", node.y + 16);
      sub.setAttribute("class", "node-sub");
      sub.textContent = node.node ? `${formatNumber(node.required)}개 필요 · ${formatNumber(node.count)}회` : `${formatNumber(node.required)}개`;
      group.appendChild(sub);
      if(isStruck){
        const strike = document.createElementNS("http://www.w3.org/2000/svg", "line");
        strike.setAttribute("x1", textX);
        strike.setAttribute("x2", node.x + nodeWidth - 12);
        strike.setAttribute("y1", node.y - 7);
        strike.setAttribute("y2", node.y - 7);
        strike.setAttribute("class", "node-strike");
        group.appendChild(strike);
      }
      group.addEventListener("click", () => {
        state.highlightKey = state.highlightKey === node.uid ? null : node.uid;
        render();
      });
      svg.appendChild(group);
    });
    svg.dataset.root = rootId;
  }
  function trimText(value, max){
    return value.length > max ? value.slice(0, max - 1) + "…" : value;
  }
  function copySummary(node, result){
    const raw = result.rawRows.map(row => `- ${row.name}: ${formatNumber(row.qty)}개 (${row.kind === "direct" ? "직접 확보" : "원재료"})`).join("\n");
    const steps = result.craftRows.map(row => `- ${row.node.name}: ${formatNumber(row.count)}회, ${formatNumber(row.produced)}개 생산`).join("\n");
    const text = `[${node.name} ${formatNumber(state.targetQty)}개]\n제작 시간: ${formatSeconds(result.totalTime)}\n\n총 재료\n${raw || "- 없음"}\n\n제작 순서\n${steps || "- 없음"}`;
    navigator.clipboard.writeText(text).then(() => toast("제작식을 클립보드에 복사했습니다.")).catch(() => toast("브라우저 권한 때문에 자동 복사하지 못했습니다."));
  }
  let lastResult = null;
  function render(){
    renderCategories();
    ensureSelectedMatchesCategory();
    const list = filteredNodes();
    renderRecipeList(list);
    const node = nodeById.get(state.selectedId) || NODES[0];
    el("searchInput").value = state.query;
    el("targetQty").value = state.targetQty;
    const membership = el("membershipToggle");
    membership.textContent = state.membership ? "멤버십 ON" : "멤버십 OFF";
    membership.classList.toggle("on", state.membership);
    membership.setAttribute("aria-pressed", String(state.membership));
    ["Name","Time","Tier"].forEach(name => {
      const key = name.toLowerCase();
      el("sort" + name + "Btn").setAttribute("aria-pressed", String(state.sort === key));
    });
    const result = calculate(node, state.targetQty);
    lastResult = result;
    renderHeader(node, result);
    renderRawRows(result.rawRows);
    renderSteps(result.craftRows);
    renderAlternatives(result);
    drawTree(result.tree);
  }
  function toast(message){
    const box = el("toast");
    box.textContent = message;
    box.classList.add("show");
    window.clearTimeout(toast.timer);
    toast.timer = window.setTimeout(() => box.classList.remove("show"), 1800);
  }
  el("searchInput").addEventListener("input", event => {
    state.query = event.target.value;
    const match = nodeSearchMatches(state.query)[0];
    if(match){
      syncCategoryToNode(match);
      state.selectedId = match.id;
      state.highlightKey = null;
      state.direct.delete(producedKey(match.name));
    }
    render();
  });
  el("membershipToggle").addEventListener("click", () => {
    state.membership = !state.membership;
    render();
  });
  el("targetQty").addEventListener("input", event => {
    state.targetQty = Math.max(1, Math.floor(Number(event.target.value) || 1));
    render();
  });
  el("sortNameBtn").addEventListener("click", () => { state.sort = "name"; render(); });
  el("sortTimeBtn").addEventListener("click", () => { state.sort = "time"; render(); });
  el("sortTierBtn").addEventListener("click", () => { state.sort = "tier"; render(); });
  el("resetDirectBtn").addEventListener("click", () => {
    state.direct.clear();
    render();
  });
  el("copyBtn").addEventListener("click", () => {
    const node = nodeById.get(state.selectedId);
    if(node && lastResult) copySummary(node, lastResult);
  });
  render();
})();
</script>
</body>
</html>
