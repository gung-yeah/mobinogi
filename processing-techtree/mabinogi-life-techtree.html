<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마비노기 모바일 생활 테크 플래너</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0d14;
    --bg-soft:#101826;
    --panel:#121927;
    --panel-2:#172233;
    --line:#263449;
    --line-strong:#3b506e;
    --ink:#eef4ff;
    --muted:#95a4ba;
    --soft:#c8d3e3;
    --accent:#58c4b6;
    --accent-2:#e5be5f;
    --danger:#f27c7c;
    --green:#62c879;
    --blue:#73a7f2;
    --purple:#b88af0;
    --pink:#eb7ab5;
    --orange:#efad58;
    --shadow:0 18px 48px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 22% 14%, rgba(88,196,182,.13), transparent 28rem),
      radial-gradient(circle at 84% 10%, rgba(229,190,95,.12), transparent 28rem),
      linear-gradient(135deg, #08101b 0%, #0a0d14 44%, #13131d 100%);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  button,input,select{
    font:inherit;
  }
  button{
    border:0;
    color:inherit;
    cursor:pointer;
  }
  .app{
    display:grid;
    grid-template-columns:320px minmax(0,1fr);
  }
  .sidebar{
    position:sticky;
    top:0;
    padding:18px;
    border-right:1px solid var(--line);
    background:rgba(12,17,27,.86);
    backdrop-filter:blur(10px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .brand-main{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .brand-mark{
    display:grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:8px;
    background:linear-gradient(135deg, rgba(88,196,182,.26), rgba(229,190,95,.18));
    border:1px solid var(--line-strong);
    overflow:hidden;
    flex:0 0 auto;
  }
  .brand-mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 38%;
    display:block;
  }
  h1{
    margin:0;
    font-size:20px;
    line-height:1.25;
    letter-spacing:0;
  }
  .subtitle{
    margin:2px 0 0;
    color:var(--muted);
    font-size:12px;
  }
  .creator-credit{
    display:inline-flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:4px;
    color:var(--danger);
    font-size:13px;
    font-weight:760;
  }
  .creator-name{
    color:var(--ink);
  }
  .control-block{
    display:grid;
    gap:10px;
    margin:14px 0;
  }
  .label{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--soft);
    font-size:12px;
    font-weight:700;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap span{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
  }
  .search{
    width:100%;
    height:40px;
    padding:0 12px 0 34px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
  }
  .search:focus,.qty-input:focus,.select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(88,196,182,.16);
  }
  .segmented,.category-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .segmented{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
  }
  #sidebarModeSwitch{
    grid-template-columns:repeat(2,minmax(0,1fr));
    margin:14px 0;
  }
  .category-stage{
    display:grid;
    gap:14px;
    margin-top:16px;
  }
  .category-stage .label{
    margin-bottom:8px;
  }
  #primaryCategoryList{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    width:100%;
  }
  #secondaryCategoryList{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
  }
  .chip{
    min-height:32px;
    padding:7px 10px;
    border-radius:8px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--soft);
    font-size:12px;
    font-weight:700;
    text-align:center;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .category-list .chip{
    width:100%;
  }
  .segmented .chip{
    width:100%;
  }
  .chip[aria-pressed="true"]{
    background:rgba(88,196,182,.18);
    border-color:rgba(88,196,182,.7);
    color:var(--ink);
  }
  .favorites-toggle{
    width:100%;
    margin-bottom:8px;
  }
  .favorites-toggle[aria-pressed="true"]{
    background:rgba(229,190,95,.18);
    border-color:rgba(229,190,95,.7);
    color:var(--accent-2);
  }
  .membership-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:40px;
    padding:0 12px;
    border-radius:8px;
    border:1px solid rgba(88,196,182,.72);
    background:transparent;
    color:#fff;
    font-size:12px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:0;
    line-height:1;
  }
  .membership-badge.on{
    background:rgba(88,196,182,.9);
    color:#fff;
  }
  .select,.qty-input{
    width:100%;
    height:40px;
    padding:0 10px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
  }
  .qty-input{
    color:var(--accent-2);
    font-weight:600;
    text-align:center;
  }
  .qty-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    align-items:center;
  }
  .qty-row .label{
    white-space:nowrap;
  }
  .qty-control,.membership-control{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:8px;
  }
  .membership-control{
    grid-template-columns:1fr;
  }
  .target-tools{
    display:grid;
    grid-template-columns:minmax(280px,1fr) 118px;
    gap:10px;
    align-items:start;
    width:min(560px,100%);
  }
  .target-field{
    display:grid;
    gap:6px;
    color:var(--soft);
    font-size:12px;
    font-weight:800;
  }
  .target-search-wrap{
    position:relative;
  }
  .target-suggestions{
    position:absolute;
    z-index:20;
    top:calc(100% + 6px);
    left:0;
    right:0;
    max-height:320px;
    overflow:auto;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:rgba(18,25,39,.98);
    box-shadow:var(--shadow);
  }
  .target-suggestion{
    display:grid;
    grid-template-columns:28px minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
    width:100%;
    min-height:44px;
    padding:7px 8px;
    border-bottom:1px solid var(--line);
    background:transparent;
    text-align:left;
  }
  .target-suggestion:last-child{ border-bottom:0; }
  .target-suggestion:hover,.target-suggestion.active{ background:rgba(88,196,182,.13); }
  .target-suggestion img{
    width:28px;
    height:28px;
    border-radius:6px;
    object-fit:cover;
    background:var(--panel-2);
  }
  .suggestion-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
    font-weight:900;
  }
  .suggestion-meta{
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
  }
  .is-hidden{ display:none !important; }
  .recipe-list{
    display:grid;
    gap:8px;
    margin-top:10px;
    max-height:clamp(360px, 60vh, 640px);
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .recipe-btn{
    display:grid;
    grid-template-columns:32px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:52px;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(18,25,39,.86);
    text-align:left;
  }
  .favorite-star{
    display:grid;
    place-items:center;
    width:26px;
    height:26px;
    font-size:16px;
    color:var(--muted);
    cursor:pointer;
    border-radius:6px;
  }
  .favorite-star:hover{
    color:var(--accent-2);
    background:rgba(229,190,95,.12);
  }
  .favorite-star.active{
    color:var(--accent-2);
  }
  .recipe-btn:hover,.recipe-btn.active{
    border-color:var(--accent);
    background:rgba(88,196,182,.13);
  }
  .item-icon{
    width:32px;
    height:32px;
    border-radius:7px;
    object-fit:cover;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,.08);
  }
  .recipe-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:800;
    font-size:13px;
  }
  .recipe-meta{
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:3px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--soft);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .main{
    min-width:0;
    padding:24px;
  }
  .topbar{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:16px;
    align-items:center;
    margin-bottom:18px;
  }
  .header-main{
    min-width:0;
  }
  .title-line{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .title-line img{
    width:48px;
    height:48px;
    border-radius:8px;
    object-fit:cover;
    border:1px solid var(--line-strong);
    background:var(--panel-2);
  }
  h2{
    margin:0;
    font-size:28px;
    line-height:1.2;
    letter-spacing:0;
  }
  .title-heading{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px 10px;
    min-width:0;
  }
  .title-row{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .header-star{
    width:30px;
    height:30px;
    font-size:20px;
  }
  .title-heading h2{
    min-width:0;
    overflow-wrap:anywhere;
  }
  .meta-line{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:0;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .actions.compact{
    align-items:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:38px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--soft);
    font-weight:800;
    font-size:12px;
  }
  .btn.primary{
    border-color:rgba(88,196,182,.78);
    background:rgba(88,196,182,.18);
    color:var(--ink);
  }
  .btn.danger{
    border-color:rgba(242,124,124,.52);
    color:#ffd6d6;
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
    margin-bottom:16px;
  }
  .stats.time-only{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .stat{
    min-height:92px;
    padding:14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(23,34,51,.86), rgba(18,25,39,.86));
    box-shadow:var(--shadow);
  }
  .stat-label{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }
  .stat-value{
    margin-top:8px;
    font-size:23px;
    line-height:1.2;
    font-weight:900;
    overflow-wrap:anywhere;
  }
  .time-stat{
    min-height:0;
    min-width:150px;
    padding:10px 12px;
  }
  .time-stat .stat-value{
    margin-top:4px;
    font-size:15px;
  }
  .stat-note{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:16px;
    align-items:start;
  }
  .panel{
    min-width:0;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(18,25,39,.84);
    box-shadow:var(--shadow);
  }
  .panel-head{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:10px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .hw-day-badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .hw-day-chip{
    min-height:28px;
    padding:5px 9px;
    font-size:11.5px;
  }
  .hw-day-chip[data-hw-day="weekly"],
  .hw-day-chip[data-hw-day="alldaily"]{
    font-weight:900;
  }
  .panel-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .panel-title{
    margin:0;
    font-size:15px;
    font-weight:900;
  }
  .panel-title-row{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .panel-title-row .badge{
    color:var(--accent-2);
    border-color:rgba(229,190,95,.36);
  }
  .panel-body{
    padding:14px 16px 16px;
  }
  .tree-wrap{
    position:relative;
    height:clamp(520px,62vh,680px);
    min-height:520px;
    overflow:hidden;
    overscroll-behavior:contain;
    cursor:grab;
    user-select:none;
  }
  .tree-reset-btn{
    position:absolute;
    left:14px;
    bottom:14px;
    z-index:3;
    margin-left:0;
    min-height:36px;
    padding:8px 16px;
    font-size:13px;
    font-weight:800;
    border-radius:9px;
    background:rgba(242,124,124,.16);
    backdrop-filter:blur(8px);
    box-shadow:0 8px 20px rgba(0,0,0,.32);
  }
  .tree-wrap.dragging{
    cursor:grabbing;
  }
  .tree-wrap.hw-mode{
    cursor:default;
  }
  .tree-zoom-controls{
    position:absolute;
    right:14px;
    bottom:14px;
    z-index:3;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .tree-zoom-btn{
    width:38px;
    height:38px;
    border-radius:9px;
    border:1px solid var(--line-strong);
    background:rgba(15,23,42,.88);
    color:var(--ink);
    font-size:18px;
    font-weight:800;
    line-height:1;
    backdrop-filter:blur(8px);
    box-shadow:0 8px 20px rgba(0,0,0,.32);
    cursor:pointer;
  }
  .tree-zoom-btn:hover{
    border-color:var(--accent);
  }
  .tree-zoom-btn:active{
    background:rgba(88,196,182,.18);
  }
  .tree-svg{
    display:block;
    min-width:760px;
    width:100%;
    height:100%;
    touch-action:none;
  }
  .node-card{
    fill:#172233;
    stroke:#344864;
    stroke-width:1;
  }
  .node-card.target{
    fill:rgba(88,196,182,.26);
    stroke:#58c4b6;
  }
  .node-card.direct{
    fill:rgba(229,190,95,.18);
    stroke:#e5be5f;
    stroke-dasharray:5 4;
  }
  .node-card.highlight{
    fill:rgba(88,196,182,.32);
    stroke:#58c4b6;
    stroke-width:2;
  }
  .node-card.struck{
    fill:rgba(242,124,124,.14);
    stroke:rgba(242,124,124,.72);
  }
  .node-icon{
    pointer-events:none;
  }
  .node-text{
    fill:var(--ink);
    font-size:14px;
    font-weight:900;
  }
  .node-sub{
    fill:var(--muted);
    font-size:12px;
  }
  .node-strike{
    stroke:var(--danger);
    stroke-width:2.2;
    pointer-events:none;
  }
  .node-alt-rect{
    fill:rgba(115,167,242,.22);
    stroke:var(--blue);
    stroke-width:1.2;
  }
  .node-alt-text{
    fill:var(--blue);
    font-size:11px;
    font-weight:800;
  }
  .node-alt-badge:hover .node-alt-rect{
    fill:rgba(115,167,242,.36);
  }
  .node-checkbox-box{
    fill:rgba(15,23,42,.5);
    stroke:var(--line-strong);
    stroke-width:1.4;
  }
  .node-checkbox-box.checked{
    fill:var(--danger);
    stroke:var(--danger);
  }
  .node-checkbox:hover .node-checkbox-box{
    stroke:var(--danger);
  }
  .node-checkbox-mark{
    fill:none;
    stroke:#0a0d14;
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
    pointer-events:none;
  }
  .edge{
    fill:none;
    stroke:#506782;
    stroke-width:1.8;
  }
  .edge.highlight{
    stroke:#58c4b6;
    stroke-width:2.8;
  }
  .table-wrap{
    overflow:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:560px;
  }
  th,td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    text-align:left;
    vertical-align:middle;
    font-size:13px;
  }
  th{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-align:center;
  }
  #rawPanel thead th,
  #altPanel thead th{
    text-align:center;
  }
  td.num{
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  td.owned-cell{
    text-align:center;
  }
  th.num{
    text-align:center;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .owned-input{
    width:86px;
    height:32px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    text-align:center;
    outline:none;
  }
  .material-cell{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    flex-wrap:nowrap;
    white-space:nowrap;
  }
  .material-cell img{
    width:26px;
    height:26px;
    border-radius:6px;
    object-fit:cover;
    background:var(--panel-2);
  }
  .material-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:800;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    min-height:22px;
    padding:2px 7px;
    border-radius:999px;
    background:#b06a1f;
    border:1px solid #b06a1f;
    color:#ffffff;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .tag.direct{
    color:#ffffff;
    border-color:#2f6fb0;
    background:#2f6fb0;
  }
  .tag.action{
    cursor:pointer;
  }
  .tag.crafted{
    color:#b6fff1;
    border-color:rgba(88,196,182,.42);
    background:rgba(88,196,182,.09);
  }
  .two-col{
    display:grid;
    grid-template-columns:minmax(240px,.8fr) minmax(340px,1fr) minmax(520px,1.45fr);
    gap:16px;
  }
  .two-col.hw-order{
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
  .two-col.hw-order #rawPanel{order:1}
  .two-col.hw-order #altPanel{order:2}
  .state-cell{
    text-align:center;
    white-space:nowrap;
  }
  .hw-group-cell{
    vertical-align:middle;
    text-align:center;
    background:rgba(255,255,255,.025);
    border-right:1px solid var(--line);
  }
  .hw-group-cell .material-cell{
    justify-content:center;
  }
  tr.hw-group-start td{
    border-top:1px solid var(--line-strong);
  }
  tr.hw-group-start:first-child td{
    border-top:1px solid var(--line);
  }
  .method-cell{
    min-width:320px;

  }
  .method-list{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .method-chip,.method-shop{
    display:inline-flex;
    align-items:center;
    gap:5px;
    max-width:100%;
    min-height:24px;
    padding:3px 8px;
    border:1px solid rgba(148,163,184,.24);
    border-radius:999px;
    background:rgba(15,23,42,.32);
    color:#d9e4f2;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .method-shop{
    border-color:rgba(88,196,182,.32);
    background:rgba(88,196,182,.08);
  }
  .method-shop.hw-use-shop{
    border-color:rgba(229,190,95,.4);
    background:rgba(229,190,95,.08);
    color:var(--accent-2);
  }
  .hw-facility-chip{
    border-color:#5b9bd8;
    background:rgba(91,155,216,.3);
    color:#eef7ff;
    font-weight:900;
  }
  .hw-gather-chip{
    border-color:rgba(122,196,140,.4);
    background:rgba(122,196,140,.1);
    color:#a9e0b8;
  }
  .hw-use-empty{
    color:var(--muted);
    font-size:11px;
  }
  .method-icon{
    width:18px;
    height:18px;
    border-radius:5px;
    object-fit:cover;
    flex:0 0 auto;
  }
  .method-icon.face{
    border-radius:50%;
    border:1px solid rgba(250,204,21,.42);
  }
  .exchange-mark{
    color:#facc15;
    font-weight:900;
  }
  #altTable tr.alt-row-method{
    background:rgba(229,190,95,.14);
    box-shadow:inset 3px 0 0 var(--accent-2);
  }
  #altTable tr.alt-row-method:hover{
    background:rgba(229,190,95,.2);
  }
  .alt-choice{
    width:100%;
    min-width:180px;
    margin-top:6px;
    height:28px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--soft);
    font-size:11px;
    font-weight:800;
  }
  .status-reset{
    margin-left:8px;
    min-height:24px;
    padding:4px 8px;
    font-size:11px;
  }
  .mabi-info{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }
  .mabi-info:empty{display:none}
  .npc-face{
    width:24px;
    height:24px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid rgba(250,204,21,.55);
    background:rgba(15,23,42,.55);
  }
  .source-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    max-width:100%;
    border:1px solid rgba(148,163,184,.24);
    border-radius:999px;
    padding:4px 8px;
    background:rgba(15,23,42,.34);
    color:#d9e4f2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .source-line{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }
  .source-line strong{color:var(--text)}
  .source-line:empty{display:none}
  .step-list,.alt-list{
    display:grid;
    gap:10px;
  }
  .step{
    display:grid;
    grid-template-columns:32px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(255,255,255,.035);
  }
  .step-title{
    font-size:13px;
    font-weight:900;
    overflow-wrap:anywhere;
  }
  .step-sub{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
  }
  .alt-item{
    display:grid;
    gap:8px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(255,255,255,.035);
  }
  .alt-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
  }
  .empty{
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
  }
  .hw-village-badges{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .hw-village-row{
    display:grid;
    gap:8px;
  }
  .hw-village-badge{
    min-height:34px;
    padding:6px 8px;
    border-radius:8px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--soft);
    font-size:12px;
    font-weight:800;
    text-align:center;
  }
  .hw-village-badge[aria-pressed="true"]{
    background:rgba(88,196,182,.2);
    border-color:var(--accent);
    color:var(--ink);
  }
  .hw-char-select-btn{
    min-height:34px;
    padding:6px 8px;
    border-radius:8px;
    background:var(--panel);
    border:1.4px solid var(--chip-color, var(--line));
    color:var(--chip-color, var(--soft));
    font-size:12px;
    font-weight:800;
    text-align:center;
  }
  .hw-char-select-btn[aria-pressed="true"]{
    background:var(--chip-color, var(--accent));
    border-color:var(--chip-color, var(--accent));
    color:var(--chip-text, var(--ink));
  }
  .hw-bulk-row{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .hw-bulk-input{
    width:100%;
    text-align:center;
  }
  .hw-reset-row{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:8px;
  }
  .hw-reset-btn{
    min-height:36px;
    padding:0 6px;
    font-size:11.5px;
  }
  .hw-header-label{
    font-size:11px;
    font-weight:800;
    color:var(--muted);
    text-align:left;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .hw-header-gauge{
    text-align:left;
    margin-left:10px;
  }
  .hw-table{
    display:grid;
    gap:3px;
    max-height:clamp(360px, 62vh, 680px);
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .hw-row{
    display:grid;
    grid-template-columns:24px minmax(0,1fr) 90px;
    align-items:center;
    gap:6px;
    padding:6px 5px;
    border-radius:6px;
  }
  .hw-row:nth-child(odd){
    background:rgba(255,255,255,.025);
  }
  .hw-row.hw-head{
    position:sticky;
    top:0;
    z-index:1;
    background:rgba(10,15,24,.94);
    backdrop-filter:blur(4px);
    align-items:end;
    padding-bottom:8px;
    border-bottom:1px solid var(--line-strong);
    margin-bottom:2px;
  }
  .hw-icon{
    width:26px;
    height:26px;
    border-radius:6px;
    object-fit:contain;
    background:var(--panel-2);
  }
  .hw-icon-broken{
    visibility:hidden;
  }
  .hw-food-name{
    min-width:0;
    font-size:12.5px;
    font-weight:700;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hw-food-name .hw-food-qty{
    color:var(--muted);
    font-weight:800;
  }
  .hw-char-row{
    display:grid;
    grid-template-columns:repeat(3, 20px);
    grid-auto-rows:20px;
    gap:3px;
    margin-left:10px;
    justify-content:end;
  }
  .hw-char-chip{
    width:20px;
    height:20px;
    padding:0;
    border-radius:50%;
    border:1.4px solid var(--chip-color, var(--line-strong));
    background:var(--panel);
    color:var(--muted);
    font-size:8.5px;
    font-weight:600;
    line-height:1;
    cursor:pointer;
    opacity:.55;
  }
  .hw-char-chip.on{
    background:var(--chip-color, var(--accent));
    color:var(--chip-text, var(--ink));
    opacity:1;
  }
  .hw-charname-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:8px;
  }
  .hw-charname-input{
    width:100%;
    height:32px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:12px;
    text-align:center;
    outline:none;
  }
  .hw-charname-input::placeholder{color:var(--muted)}
  .hw-charbtn-grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:8px;
  }
  .hw-cycle-daily{color:var(--accent-2)}
  .hw-cycle-weekly{color:var(--blue)}
  .hw-add-form{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .hw-add-select,
  .hw-add-input{
    width:100%;
    height:32px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:12px;
    outline:none;
  }
  .hw-add-input::placeholder{color:var(--muted)}
  .hw-add-row2{
    display:grid;
    grid-template-columns:minmax(0,1fr) 76px;
    gap:8px;
  }
  .hw-add-actions{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:8px;
  }
  .hw-add-submit{
    padding:0 6px;
    font-size:12.5px;
  }
  .hw-custom-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:10px;
  }
  .hw-custom-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    font-size:11.5px;
  }
  .hw-custom-item-text{
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--soft);
  }
  .hw-custom-item-text b{color:var(--ink)}
  .hw-custom-delete{
    flex:0 0 auto;
    min-height:26px;
    padding:2px 9px;
    border-radius:999px;
    border:1px solid rgba(242,124,124,.4);
    background:rgba(242,124,124,.1);
    color:var(--danger);
    font-size:11px;
    font-weight:800;
    cursor:pointer;
  }
  .homework-board{
    position:absolute;
    inset:0;
    overflow:auto;
    padding:16px;
  }
  .hw-villages{
    display:grid;
    grid-template-columns:repeat(5,minmax(230px,1fr));
    gap:0 10px;
    min-width:1250px;
  }
  .hw-villages.hw-villages-solo{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
    gap:16px;
    min-width:0;
    align-items:start;
  }
  .hw-village.hw-village-solo{
    width:100%;
  }
  .hw-solo-merchants{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:flex-start;
  }
  .hw-solo-merchants .hw-merchant{
    flex:0 0 auto;
    margin-bottom:0;
    min-width:190px;
  }
  .hw-village-col-stack{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .hw-village{
    border-radius:10px;
    background:rgba(255,255,255,.02);
    padding:10px 10px 16px;
  }
  .hw-village-col-stack .hw-village{
    flex:0 0 auto;
  }
  .hw-village-title{
    text-align:center;
    font-size:14px;
    font-weight:900;
    color:var(--accent-2);
    margin-bottom:12px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(229,190,95,.28);
  }
  .hw-merchant{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    padding:8px;
    border-radius:9px;
    background:color-mix(in srgb, var(--hw-mc, var(--accent)) 10%, rgba(255,255,255,.02));
    border:1px solid color-mix(in srgb, var(--hw-mc, var(--accent)) 45%, transparent);
    border-left:4px solid var(--hw-mc, var(--accent));
  }
  .hw-merchant-head{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    flex:0 0 auto;
    width:58px;
    text-align:center;
  }
  .hw-merchant-face{
    width:30px;
    height:30px;
    flex:0 0 auto;
    object-fit:cover;
    border-color:var(--hw-mc, var(--accent));
  }
  .hw-merchant-face-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--hw-mc, var(--accent));
    color:#0a0d14;
    font-weight:900;
    font-size:13px;
  }
  .hw-merchant-name{
    text-align:center;
    font-size:11px;
    line-height:1.35;
    color:var(--soft);
    font-weight:800;
  }
  .hw-merchant-name .hw-cycle-daily,.hw-merchant-name .hw-cycle-weekly{
    display:block;
    font-size:9px;
    font-weight:900;
    margin-top:2px;
  }
  .hw-cards{
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
    min-width:0;
  }
  .hw-cards-grid{
    display:grid;
    grid-template-columns:repeat(2, 134px);
    gap:8px 6px;
  }
  .hw-cards-grid .hw-card{
    min-width:0;
  }
  .hw-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:3px;
    padding:3px 8px 3px 3px;
    border-radius:8px;
    cursor:pointer;
    transition:opacity .15s ease, background .15s ease, filter .15s ease;
  }
  .hw-card:hover{
    background:rgba(255,255,255,.06);
  }
  .hw-card.hw-card-done{
    opacity:.5;
    background:rgba(242,124,124,.16);
    filter:saturate(.65) brightness(.82);
  }
  .hw-card.hw-card-done:hover{
    background:rgba(242,124,124,.24);
  }
  .hw-card.hw-card-custom:not(.hw-card-done){
    border:1.5px solid #b98af0;
    background:rgba(185,138,240,.14);
  }
  .hw-card.hw-card-custom:not(.hw-card-done):hover{
    background:rgba(185,138,240,.22);
  }
  .hw-card-check{
    position:absolute;
    top:-6px;
    right:-2px;
    z-index:1;
    width:17px;
    height:17px;
    border-radius:999px;
    background:#facc15;
    color:#3a2a00;
    font-size:11px;
    font-weight:900;
    line-height:17px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .hw-merchant.hw-merchant-done{
    border-color:rgba(242,124,124,.55);
    background:rgba(242,124,124,.06);
  }
  .hw-merchant-check{
    margin-top:2px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:1px 6px;
    border-radius:999px;
    background:#facc15;
    color:#3a2a00;
    font-size:9px;
    font-weight:900;
  }
  .hw-icon-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:46px;
  }
  .hw-icon-wrap img{
    width:38px;
    height:38px;
    border-radius:8px;
    object-fit:contain;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,.1);
  }
  .hw-icon-wrap.hw-material img{
    width:32px;
    height:32px;
  }
  .hw-icon-name{
    margin-top:3px;
    font-size:9.5px;
    text-align:center;
    color:var(--soft);
    max-width:48px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .hw-count-badge{
    position:absolute;
    right:-2px;
    bottom:16px;
    min-width:16px;
    height:16px;
    padding:0 3px;
    border-radius:999px;
    background:#fff;
    border:1px solid rgba(0,0,0,.25);
    color:#171717;
    font-size:10px;
    font-weight:900;
    line-height:16px;
    text-align:center;
  }
  .hw-arrow{
    color:var(--muted);
    font-size:13px;
    margin:0 1px;
  }
  .toast{
    position:fixed;
    right:18px;
    bottom:18px;
    max-width:360px;
    padding:11px 13px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:rgba(18,25,39,.96);
    color:var(--ink);
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    font-size:13px;
  }
  .toast.show{
    opacity:1;
    transform:translateY(0);
  }
  @media (max-width:1080px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:relative;
      height:auto;
      border-right:0;
      border-bottom:1px solid var(--line);
    }
    .recipe-list{
      grid-template-columns:repeat(2,minmax(0,1fr));
      max-height:360px;
      overflow:auto;
    }
    .layout,.two-col,.two-col.hw-order{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .main{padding:16px}
    .topbar{grid-template-columns:1fr}
    .actions{justify-content:flex-start}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .recipe-list{grid-template-columns:1fr}
    .tree-svg{min-width:560px}
    .target-tools{grid-template-columns:minmax(0,1fr) 100px}
    h2{font-size:23px}
  }
  @media (max-width:460px){
    .stats{grid-template-columns:1fr}
    .qty-row{grid-template-columns:1fr 1fr}
    .title-line{align-items:flex-start}
    .hw-row{grid-template-columns:22px minmax(0,1fr) 68px; gap:4px}
    .hw-char-chip{width:17px;height:17px;font-size:7.5px}
    .hw-char-row{grid-template-columns:repeat(3, 17px);grid-auto-rows:17px;gap:2px;margin-left:4px}
    .hw-food-name{font-size:11px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-main">
        <div class="brand-mark" aria-hidden="true"><img src="icons/sidebar-logo.jpg" alt=""></div>
        <div>
          <h1>생활 테크 플래너</h1>
          <div class="creator-credit"><span class="creator-name">By 알리사 르구댕뿐예</span></div>
        </div>
      </div>
    </div>

    <div class="segmented" id="sidebarModeSwitch">
      <button class="chip" id="sidebarModeLifeBtn" type="button" aria-pressed="true">생활</button>
      <button class="chip" id="sidebarModeHomeworkBtn" type="button" aria-pressed="false">숙제</button>
    </div>

    <div id="lifeSidebarPanel">
      <div class="control-block">
        <label class="label" for="searchInput"><span>아이템 검색</span><span id="resultCount"></span></label>
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input class="search" id="searchInput" type="search" autocomplete="off" lang="ko" inputmode="text">
        </div>
        <div class="qty-row">
          <div class="qty-control">
            <label class="label" for="targetQty"><span>수량</span></label>
            <input class="qty-input" id="targetQty" type="number" min="1" step="1" value="1" aria-label="목표 수량">
          </div>
          <div class="membership-control">
            <button class="membership-badge on" id="membershipToggle" type="button" aria-pressed="true">멤버십 ON</button>
          </div>
        </div>
      </div>

      <div class="control-block category-stage">
        <div>
          <button class="chip favorites-toggle" id="favoritesToggleBtn" type="button" aria-pressed="false">⭐ 즐겨찾기</button>
          <div class="label"><span>1차 카테고리</span></div>
          <div class="category-list" id="primaryCategoryList"></div>
        </div>
        <div>
          <div class="label"><span>2차 카테고리</span></div>
          <div class="category-list" id="secondaryCategoryList"></div>
        </div>
      </div>

      <div class="control-block">
        <div class="label"><span>표시 기준</span></div>
        <div class="segmented">
          <button class="chip" id="sortNameBtn" type="button" aria-pressed="true">이름순</button>
          <button class="chip" id="sortTimeBtn" type="button" aria-pressed="false">시간순</button>
          <button class="chip" id="sortTierBtn" type="button" aria-pressed="false">단계순</button>
        </div>
      </div>

          state.choices[node.key] = next.id;
          render();
        });
        group.appendChild(altGroup);
      }
      if(!isRootNode){
        const boxSize = 16;
        const boxX = node.x + nodeWidth - boxSize - 8;
        const boxY = node.y + nodeHeight / 2 - boxSize - 6;
        const checkGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        checkGroup.setAttribute("class", "node-checkbox");
        checkGroup.style.cursor = "pointer";
        const checkRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        checkRect.setAttribute("x", boxX);
        checkRect.setAttribute("y", boxY);
        checkRect.setAttribute("width", boxSize);
        checkRect.setAttribute("height", boxSize);
        checkRect.setAttribute("rx", 4);
        checkRect.setAttribute("class", "node-checkbox-box" + (isStruck ? " checked" : ""));
        checkGroup.appendChild(checkRect);
        if(isStruck){
          const check = document.createElementNS("http://www.w3.org/2000/svg", "path");
          check.setAttribute("d", `M${boxX + 3},${boxY + 8.5} L${boxX + 6.5},${boxY + 12} L${boxX + 13},${boxY + 4}`);
          check.setAttribute("class", "node-checkbox-mark");
          checkGroup.appendChild(check);
        }
        const checkTitle = document.createElementNS("http://www.w3.org/2000/svg", "title");
        checkTitle.textContent = isStruck ? "확보 완료 해제" : "확보 완료로 표시";
        checkGroup.appendChild(checkTitle);
        checkGroup.addEventListener("click", event => {
          event.stopPropagation();
          toggleNodeDirect(node);
          render();
        });
        group.appendChild(checkGroup);
      }
      group.addEventListener("click", () => {
        const isRoot = node.uid === rootId;
        if(!isRoot) toggleNodeDirect(node);
        render();
      });
      svg.appendChild(group);
    });
    svg.dataset.root = rootId;
  }
  function trimText(value, max){
    return value.length > max ? value.slice(0, max - 1) + "…" : value;
  }
  let lastResult = null;
  function render(){

    const result = calculate(node, state.targetQty);
    lastResult = result;

    renderRawRows(materialRowsForFocus(result));
    renderSteps(result.craftRows);

  el("searchInput").addEventListener("input", event => {
    state.query = event.target.value;

  function toggleFavorite(key){

  el("favoritesToggleBtn").addEventListener("click", () => {

  el("targetQty").addEventListener("input", event => {

  el("sortNameBtn").addEventListener("click", () => { state.sort = "name"; render(); });

  function setSidebarMode(mode){

    el("statTime").classList.toggle("is-hidden", isHomework);
    el("treeSvg").classList.toggle("is-hidden", isHomework);
    el("homeworkBoard").classList.toggle("is-hidden", !isHomework);
    el("treeWrap").classList.toggle("hw-mode", isHomework);

  el("sidebarModeLifeBtn").addEventListener("click", () => setSidebarMode("life"));
  el("sidebarModeHomeworkBtn").addEventListener("click", () => setSidebarMode("homework"));
  function resetSecuredState(){
    state.direct.clear();
    state.owned = {};
    state.rawOwned = {};
    state.rawDirect = {};
    render();
  }
  function resetHomeworkChecks(){
    state.homeworkChecks = {};
    state.hwOwned = {};
    state.hwSecured = {};
    state.hwCardDone = {};

    renderHomeworkBoard();
    renderHomeworkTotals();
    renderHomeworkAlt();
    renderHwBulkChars();
    savePersistedState();
  }
  function hwResetByCycle(cycle){
    const affectedFoods = new Set();
    const affectedMaterials = new Set();
    hwAllExchanges().forEach(ex => {
      if(ex.cycle === cycle && state.hwCardDone[ex.id]){
        delete state.hwCardDone[ex.id];
        affectedFoods.add(ex.food);
        affectedMaterials.add(ex.material);
      }
    });
    affectedFoods.forEach(hwSyncFoodSecured);
    affectedMaterials.forEach(hwSyncMaterialSecured);
    renderHomeworkBoard();
    renderHomeworkTotals();
    renderHomeworkAlt();
    savePersistedState();
  }
  el("resetDirectBtn").addEventListener("click", resetSecuredState);
  el("resetRawBtn").addEventListener("click", () => {
    if(state.sidebarMode === "homework") resetHomeworkChecks();
    else resetSecuredState();
  });
  el("resetAltBtn").addEventListener("click", resetHomeworkChecks);
  el("hwDayBadges").querySelectorAll(".hw-day-chip").forEach(btn => {
    btn.addEventListener("click", () => hwToggleDayBadge(btn.dataset.hwDay));
  });
  function renderHwCharNames(){
    const box = el("hwCharNames");

    box.innerHTML = [0,1,2,3,4,5].map(i => `<input class="hw-charname-input" data-hw-char-idx="${i}" type="text" maxlength="8" placeholder="캐릭터${i + 1}" value="${escapeHtml(state.hwCharNames[i] || "")}" aria-label="캐릭터 ${i + 1} 이름">`).join("");
    box.querySelectorAll(".hw-charname-input").forEach(input => {
      input.addEventListener("input", event => {
        const idx = Number(input.dataset.hwCharIdx);
        state.hwCharNames[idx] = event.target.value;

        renderHomeworkSidebar();
        renderHomeworkBoard();
        renderHwBulkChars();
      });

  }
  function renderHwBulkChars(){
    const box = el("hwBulkChars");

      const c = HW_CHAR_COLORS[i];
      return `<button type="button" class="hw-char-select-btn" style="--chip-color:${c.bg};--chip-text:${c.text}" data-hw-bulk-idx="${i}" aria-pressed="${allOn}">${escapeHtml(hwCharName(i))}</button>`;
    }).join("");
    box.querySelectorAll("[data-hw-bulk-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.dataset.hwBulkIdx);
        const list = hwFilteredExchanges();
        const allOn = list.length > 0 && list.every(ex => hwCharArray(ex.id)[idx]);
        list.forEach(ex => {
          const arr = hwCharArray(ex.id).slice();
          arr[idx] = !allOn;
          hwSetCharArray(ex.id, arr);
        });
        renderHomeworkSidebar();
        renderHomeworkBoard();
        renderHomeworkTotals();
        renderHomeworkAlt();
        renderHwBulkChars();
        savePersistedState();
      });

  }
  function renderHwAddVillageOptions(){
    const select = el("hwAddVillage");
    if(!select || select.options.length) return;
    select.innerHTML = HW_VILLAGES.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
  }
  let hwAddCycleValue = "daily";
  const hwAddCycleBox = el("hwAddCycle");
  if(hwAddCycleBox){
    hwAddCycleBox.querySelectorAll("[data-cycle]").forEach(btn => {
      btn.addEventListener("click", () => {
        hwAddCycleValue = btn.dataset.cycle;
        hwAddCycleBox.querySelectorAll("[data-cycle]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      });
    });
  }
  function renderHwCustomList(){
    const box = el("hwCustomList");
    if(!box) return;
    if(!state.hwCustomExchanges.length){
      box.innerHTML = "";
      return;
    }
    box.innerHTML = state.hwCustomExchanges.map(ex => `
      <div class="hw-custom-item">
        <button class="hw-custom-delete" type="button" data-hw-custom-id="${ex.id}">삭제</button>
        <span class="hw-custom-item-text"><b>${escapeHtml(ex.food)}</b> ${ex.foodQty}개 → <b>${escapeHtml(ex.material)}</b> ${ex.matQty}개 · ${escapeHtml(ex.npc)}(${escapeHtml(ex.village)}) · ${ex.cycle === "daily" ? "일일" : "주간"}</span>
      </div>
    `).join("");
    box.querySelectorAll(".hw-custom-delete").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.hwCustomId);
        state.hwCustomExchanges = state.hwCustomExchanges.filter(ex => ex.id !== id);
        delete state.homeworkChecks[id];
        delete state.hwCardDone[id];
        renderHwCustomList();
        renderHomeworkSidebar();
        renderHomeworkBoard();
        renderHomeworkTotals();
        renderHomeworkAlt();
        renderHwBulkChars();
        savePersistedState();
      });
    });
  }
  const hwAddSubmitBtn = el("hwAddSubmitBtn");
  if(hwAddSubmitBtn){
    hwAddSubmitBtn.addEventListener("click", () => {
      const village = el("hwAddVillage").value;

      const foodQty = Math.max(1, parseInt(el("hwAddFoodQty").value, 10) || 0);
      const matQty = Math.max(1, parseInt(el("hwAddMaterialQty").value, 10) || 0);
      if(!npc || !place || !food || !material || !foodQty || !matQty){
        toast("모든 항목을 입력해주세요.");
        return;
      }
      const id = state.hwCustomNextId;
      state.hwCustomNextId -= 1;
      state.hwCustomExchanges.push({id, food, foodQty, material, matQty, cycle:hwAddCycleValue, npc, place, village});
      el("hwAddNpc").value = "";
      el("hwAddPlace").value = "";
      el("hwAddFood").value = "";
      el("hwAddMaterial").value = "";
      el("hwAddFoodQty").value = "";
      el("hwAddMaterialQty").value = "";
      renderHwCustomList();
      renderHomeworkSidebar();
      renderHomeworkBoard();
      renderHomeworkTotals();
      renderHomeworkAlt();
      renderHwBulkChars();
      savePersistedState();
      toast("숙제를 추가했습니다.");
    });
  }
  el("hwResetDailyBtn").addEventListener("click", () => hwResetByCycle("daily"));
  el("hwResetWeeklyBtn").addEventListener("click", () => hwResetByCycle("weekly"));
  el("hwResetAllBtn").addEventListener("click", resetHomeworkChecks);
  const treeSvg = el("treeSvg");
  const treeWrap = treeSvg.parentElement;
  function treeMapSize(){
    return {
      width:Number(treeSvg.dataset.mapWidth) || 760,
      height:Number(treeSvg.dataset.mapHeight) || 460
    };
  }
  function applyTreeViewBox(svg = treeSvg){
    const map = treeMapSize();
    const zoom = Math.min(2.4, Math.max(0.55, state.treeZoom || 1));
    state.treeZoom = zoom;
    const viewWidth = map.width / zoom;
    const viewHeight = map.height / zoom;
    const panPadX = viewWidth * 0.45;
    const panPadY = viewHeight * 0.45;
    const minPanX = -panPadX;
    const minPanY = -panPadY;
    const maxPanX = Math.max(0, map.width - viewWidth) + panPadX;
    const maxPanY = Math.max(0, map.height - viewHeight) + panPadY;
    state.treePanX = Math.min(maxPanX, Math.max(minPanX, state.treePanX || 0));
    state.treePanY = Math.min(maxPanY, Math.max(minPanY, state.treePanY || 0));
    svg.setAttribute("viewBox", `${state.treePanX} ${state.treePanY} ${viewWidth} ${viewHeight}`);
  }
  function treePointFromEvent(event){
    const rect = treeSvg.getBoundingClientRect();
    const map = treeMapSize();
    const viewWidth = map.width / (state.treeZoom || 1);
    const viewHeight = map.height / (state.treeZoom || 1);
    return {
      x:state.treePanX + ((event.clientX - rect.left) / rect.width) * viewWidth,
      y:state.treePanY + ((event.clientY - rect.top) / rect.height) * viewHeight,
      ratioX:(event.clientX - rect.left) / rect.width,
      ratioY:(event.clientY - rect.top) / rect.height,
      viewWidth,
      viewHeight
    };
  }
  function zoomTreeByFactor(factor){
    if(!lastResult) return;
    const oldZoom = state.treeZoom || 1;
    const nextZoom = Math.min(2.4, Math.max(0.55, oldZoom * factor));
    if(Math.abs(nextZoom - oldZoom) < 0.001) return;
    const map = treeMapSize();
    const viewWidth = map.width / oldZoom;
    const viewHeight = map.height / oldZoom;
    const focusX = state.treePanX + viewWidth / 2;
    const focusY = state.treePanY + viewHeight / 2;
    state.treeZoom = nextZoom;
    state.treePanX = focusX - (map.width / nextZoom) / 2;
    state.treePanY = focusY - (map.height / nextZoom) / 2;
    applyTreeViewBox();
  }
  el("treeZoomInBtn").addEventListener("click", () => zoomTreeByFactor(1.2));
  el("treeZoomOutBtn").addEventListener("click", () => zoomTreeByFactor(1 / 1.2));
  treeWrap.addEventListener("wheel", event => {
    if(state.sidebarMode === "homework") return;
    if(!lastResult) return;
    event.preventDefault();
    const point = treePointFromEvent(event);
    const oldZoom = state.treeZoom || 1;
    const nextZoom = Math.min(2.4, Math.max(0.55, oldZoom * (event.deltaY < 0 ? 1.12 : 1 / 1.12)));
    if(Math.abs(nextZoom - oldZoom) < 0.001) return;
    const map = treeMapSize();
    state.treeZoom = nextZoom;
    state.treePanX = point.x - point.ratioX * (map.width / nextZoom);
    state.treePanY = point.y - point.ratioY * (map.height / nextZoom);
    applyTreeViewBox();
  }, {passive:false});
  let treeDrag = null;
  let treeDragBlockClick = false;
  const activePointers = new Map();
  let pinch = null;
  function pinchPointerDistance(){
    const pts = [...activePointers.values()];
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
  function pinchPointerMidpoint(){
    const pts = [...activePointers.values()];
    return {x:(pts[0].x + pts[1].x) / 2, y:(pts[0].y + pts[1].y) / 2};
  }
  treeWrap.addEventListener("pointerdown", event => {
    if(state.sidebarMode === "homework") return;
    if(event.button !== 0) return;
    activePointers.set(event.pointerId, {x:event.clientX, y:event.clientY});
    if(activePointers.size === 2){
      treeDrag = null;
      const mid = pinchPointerMidpoint();
      const rect = treeSvg.getBoundingClientRect();
      const map = treeMapSize();
      const viewWidth = map.width / (state.treeZoom || 1);
      const viewHeight = map.height / (state.treeZoom || 1);
      const ratioX = (mid.x - rect.left) / rect.width;
      const ratioY = (mid.y - rect.top) / rect.height;
      pinch = {
        dist:pinchPointerDistance(),
        zoom:state.treeZoom || 1,
        focusX:state.treePanX + ratioX * viewWidth,
        focusY:state.treePanY + ratioY * viewHeight,
        ratioX,
        ratioY
      };
      treeWrap.classList.add("dragging");
      return;
    }
    if(activePointers.size > 2) return;
    const point = treePointFromEvent(event);
    treeDrag = {
      id:event.pointerId,
      x:event.clientX,
      y:event.clientY,
      panX:state.treePanX,
      panY:state.treePanY,
      viewWidth:point.viewWidth,
      viewHeight:point.viewHeight,
      moved:false,
      captured:false
    };
    treeWrap.classList.add("dragging");
  });
  treeWrap.addEventListener("pointermove", event => {
    if(activePointers.has(event.pointerId)){
      activePointers.set(event.pointerId, {x:event.clientX, y:event.clientY});
    }
    if(pinch && activePointers.size === 2){
      event.preventDefault();
      const newDist = pinchPointerDistance();
      if(newDist <= 0) return;
      const nextZoom = Math.min(2.4, Math.max(0.55, pinch.zoom * (newDist / pinch.dist)));
      const map = treeMapSize();
      state.treeZoom = nextZoom;
      state.treePanX = pinch.focusX - pinch.ratioX * (map.width / nextZoom);
      state.treePanY = pinch.focusY - pinch.ratioY * (map.height / nextZoom);
      applyTreeViewBox();
      return;
    }
    if(!treeDrag || event.pointerId !== treeDrag.id) return;
    const dx = event.clientX - treeDrag.x;
    const dy = event.clientY - treeDrag.y;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) treeDrag.moved = true;
    if(!treeDrag.moved) return;
    if(!treeDrag.captured){
      treeWrap.setPointerCapture(event.pointerId);
      treeDrag.captured = true;
    }
    event.preventDefault();
    const rect = treeSvg.getBoundingClientRect();
    state.treePanX = treeDrag.panX - (dx / rect.width) * treeDrag.viewWidth;
    state.treePanY = treeDrag.panY - (dy / rect.height) * treeDrag.viewHeight;
    applyTreeViewBox();
  });
  const finishTreeDrag = event => {
    activePointers.delete(event.pointerId);
    const wasPinching = !!pinch;
    if(activePointers.size < 2) pinch = null;
    if(wasPinching){
      treeWrap.classList.remove("dragging");
      treeDragBlockClick = true;
      window.setTimeout(() => { treeDragBlockClick = false; }, 0);
    }
    if(!treeDrag || event.pointerId !== treeDrag.id) return;
    if(treeDrag.moved){
      treeDragBlockClick = true;
      window.setTimeout(() => { treeDragBlockClick = false; }, 0);
    }
    treeWrap.classList.remove("dragging");
    if(treeWrap.hasPointerCapture(event.pointerId)) treeWrap.releasePointerCapture(event.pointerId);
    treeDrag = null;
  };
  treeWrap.addEventListener("pointerup", finishTreeDrag);
  treeWrap.addEventListener("pointercancel", finishTreeDrag);
  treeWrap.addEventListener("click", event => {
    if(!treeDragBlockClick) return;
    event.preventDefault();
    event.stopPropagation();
    treeDragBlockClick = false;
  }, true);
  render();
  setSidebarMode(state.sidebarMode || "life");
})();
</script>

      if(pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        window.parent.postMessage({type:"mabinogi-techtree-height", height:document.documentElement.scrollHeight}, "*");
      });

    window.addEventListener("load", reportHeight);
    window.addEventListener("resize", reportHeight);
    new MutationObserver(reportHeight).observe(document.body, {childList:true, subtree:true, attributes:true});
    reportHeight();
  })();
</script>
