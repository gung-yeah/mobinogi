<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마비노기 모바일 생활 테크 플래너</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0d14;
    --bg-soft:#101826;
    --panel:#121927;
    --panel-2:#172233;
    --line:#263449;
    --line-strong:#3b506e;
    --ink:#eef4ff;
    --muted:#95a4ba;
    --soft:#c8d3e3;
    --accent:#58c4b6;
    --accent-2:#e5be5f;
    --danger:#f27c7c;
    --green:#62c879;
    --blue:#73a7f2;
    --purple:#b88af0;
    --pink:#eb7ab5;
    --orange:#efad58;
    --shadow:0 18px 48px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(circle at 22% 14%, rgba(88,196,182,.13), transparent 28rem),
      radial-gradient(circle at 84% 10%, rgba(229,190,95,.12), transparent 28rem),
      linear-gradient(135deg, #08101b 0%, #0a0d14 44%, #13131d 100%);
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  button,input,select{
    font:inherit;
  }
  button{
    border:0;
    color:inherit;
    cursor:pointer;
  }
  .app{
    display:grid;
    grid-template-columns:320px minmax(0,1fr);
  }
  .sidebar{
    position:sticky;
    top:0;
    padding:18px;
    border-right:1px solid var(--line);
    background:rgba(12,17,27,.86);
    backdrop-filter:blur(10px);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .brand-main{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .brand-mark{
    display:grid;
    place-items:center;
    width:40px;
    height:40px;
    border-radius:8px;
    background:linear-gradient(135deg, rgba(88,196,182,.26), rgba(229,190,95,.18));
    border:1px solid var(--line-strong);
    overflow:hidden;
    flex:0 0 auto;
  }
  .brand-mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 38%;
    display:block;
  }
  h1{
    margin:0;
    font-size:20px;
    line-height:1.25;
    letter-spacing:0;
  }
  .subtitle{
    margin:2px 0 0;
    color:var(--muted);
    font-size:12px;
  }
  .creator-credit{
    display:inline-flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:4px;
    color:var(--danger);
    font-size:13px;
    font-weight:760;
  }
  .creator-avatar{
    width:28px;
    height:28px;
    border-radius:8px;
    object-fit:cover;
    box-shadow:0 0 0 1px rgba(24,32,42,.08);
    flex:0 0 auto;
  }
  .creator-name{
    color:var(--ink);
  }
  .control-block{
    display:grid;
    gap:10px;
    margin:14px 0;
  }
  .label{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--soft);
    font-size:12px;
    font-weight:700;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap span{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:var(--muted);
    pointer-events:none;
  }
  .search{
    width:100%;
    height:40px;
    padding:0 12px 0 34px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
  }
  .search:focus,.qty-input:focus,.select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(88,196,182,.16);
  }
  .segmented,.category-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .segmented{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
  }
  .category-stage{
    display:grid;
    gap:14px;
    margin-top:16px;
  }
  .category-stage .label{
    margin-bottom:8px;
  }
  #primaryCategoryList{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    width:100%;
  }
  #secondaryCategoryList{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
  }
  .chip{
    min-height:32px;
    padding:7px 10px;
    border-radius:8px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--soft);
    font-size:12px;
    font-weight:700;
    text-align:center;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .category-list .chip{
    width:100%;
  }
  .segmented .chip{
    width:100%;
  }
  .chip[aria-pressed="true"]{
    background:rgba(88,196,182,.18);
    border-color:rgba(88,196,182,.7);
    color:var(--ink);
  }
  .membership-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:40px;
    padding:0 12px;
    border-radius:8px;
    border:1px solid rgba(88,196,182,.72);
    background:transparent;
    color:#fff;
    font-size:12px;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:0;
    line-height:1;
  }
  .membership-badge.on{
    background:rgba(88,196,182,.9);
    color:#fff;
  }
  .select,.qty-input{
    width:100%;
    height:40px;
    padding:0 10px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    outline:none;
  }
  .qty-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    align-items:center;
  }
  .qty-row .label{
    white-space:nowrap;
  }
  .qty-control,.membership-control{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    align-items:center;
    gap:8px;
  }
  .membership-control{
    grid-template-columns:1fr;
  }
  .target-tools{
    display:grid;
    grid-template-columns:minmax(280px,1fr) 118px;
    gap:10px;
    align-items:start;
    width:min(560px,100%);
  }
  .target-field{
    display:grid;
    gap:6px;
    color:var(--soft);
    font-size:12px;
    font-weight:800;
  }
  .target-search-wrap{
    position:relative;
  }
  .target-suggestions{
    position:absolute;
    z-index:20;
    top:calc(100% + 6px);
    left:0;
    right:0;
    max-height:320px;
    overflow:auto;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:rgba(18,25,39,.98);
    box-shadow:var(--shadow);
  }
  .target-suggestion{
    display:grid;
    grid-template-columns:28px minmax(0,1fr) auto;
    align-items:center;
    gap:8px;
    width:100%;
    min-height:44px;
    padding:7px 8px;
    border-bottom:1px solid var(--line);
    background:transparent;
    text-align:left;
  }
  .target-suggestion:last-child{ border-bottom:0; }
  .target-suggestion:hover,.target-suggestion.active{ background:rgba(88,196,182,.13); }
  .target-suggestion img{
    width:28px;
    height:28px;
    border-radius:6px;
    object-fit:cover;
    background:var(--panel-2);
  }
  .suggestion-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:12px;
    font-weight:900;
  }
  .suggestion-meta{
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
  }
  .is-hidden{ display:none !important; }
  .recipe-list{
    display:grid;
    gap:8px;
    margin-top:10px;
    max-height:clamp(360px, 60vh, 640px);
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .recipe-btn{
    display:grid;
    grid-template-columns:32px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    width:100%;
    min-height:52px;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(18,25,39,.86);
    text-align:left;
  }
  .recipe-btn:hover,.recipe-btn.active{
    border-color:var(--accent);
    background:rgba(88,196,182,.13);
  }
  .item-icon{
    width:32px;
    height:32px;
    border-radius:7px;
    object-fit:cover;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,.08);
  }
  .recipe-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:800;
    font-size:13px;
  }
  .recipe-meta{
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:3px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--soft);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .main{
    min-width:0;
    padding:24px;
  }
  .topbar{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:16px;
    align-items:center;
    margin-bottom:18px;
  }
  .header-main{
    min-width:0;
  }
  .title-line{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .title-line img{
    width:48px;
    height:48px;
    border-radius:8px;
    object-fit:cover;
    border:1px solid var(--line-strong);
    background:var(--panel-2);
  }
  h2{
    margin:0;
    font-size:28px;
    line-height:1.2;
    letter-spacing:0;
  }
  .title-heading{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px 10px;
    min-width:0;
  }
  .title-heading h2{
    min-width:0;
    overflow-wrap:anywhere;
  }
  .meta-line{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:0;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .actions.compact{
    align-items:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:38px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--soft);
    font-weight:800;
    font-size:12px;
  }
  .btn.primary{
    border-color:rgba(88,196,182,.78);
    background:rgba(88,196,182,.18);
    color:var(--ink);
  }
  .btn.danger{
    border-color:rgba(242,124,124,.52);
    color:#ffd6d6;
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
    margin-bottom:16px;
  }
  .stats.time-only{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .stat{
    min-height:92px;
    padding:14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(23,34,51,.86), rgba(18,25,39,.86));
    box-shadow:var(--shadow);
  }
  .stat-label{
    color:var(--muted);
    font-size:12px;
    font-weight:700;
  }
  .stat-value{
    margin-top:8px;
    font-size:23px;
    line-height:1.2;
    font-weight:900;
    overflow-wrap:anywhere;
  }
  .time-stat{
    min-height:0;
    min-width:150px;
    padding:10px 12px;
  }
  .time-stat .stat-value{
    margin-top:4px;
    font-size:15px;
  }
  .stat-note{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
  }
  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:16px;
    align-items:start;
  }
  .panel{
    min-width:0;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(18,25,39,.84);
    box-shadow:var(--shadow);
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .panel-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .panel-title{
    margin:0;
    font-size:15px;
    font-weight:900;
  }
  .panel-title-row{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .panel-title-row .badge{
    color:var(--accent-2);
    border-color:rgba(229,190,95,.36);
  }
  .panel-body{
    padding:14px 16px 16px;
  }
  .tree-wrap{
    position:relative;
    height:clamp(520px,62vh,680px);
    min-height:520px;
    overflow:hidden;
    overscroll-behavior:contain;
    cursor:grab;
    user-select:none;
  }
  .tree-reset-btn{
    position:absolute;
    left:14px;
    bottom:14px;
    z-index:3;
    margin-left:0;
    min-height:36px;
    padding:8px 16px;
    font-size:13px;
    font-weight:800;
    border-radius:9px;
    background:rgba(242,124,124,.16);
    backdrop-filter:blur(8px);
    box-shadow:0 8px 20px rgba(0,0,0,.32);
  }
  .tree-wrap.dragging{
    cursor:grabbing;
  }
  .tree-svg{
    display:block;
    min-width:760px;
    width:100%;
    height:100%;
    touch-action:none;
  }
  .node-card{
    fill:#172233;
    stroke:#344864;
    stroke-width:1;
  }
  .node-card.target{
    fill:rgba(88,196,182,.26);
    stroke:#58c4b6;
  }
  .node-card.direct{
    fill:rgba(229,190,95,.18);
    stroke:#e5be5f;
    stroke-dasharray:5 4;
  }
  .node-card.highlight{
    fill:rgba(88,196,182,.32);
    stroke:#58c4b6;
    stroke-width:2;
  }
  .node-card.struck{
    fill:rgba(242,124,124,.14);
    stroke:rgba(242,124,124,.72);
  }
  .node-icon{
    pointer-events:none;
  }
  .node-text{
    fill:var(--ink);
    font-size:14px;
    font-weight:900;
  }
  .node-sub{
    fill:var(--muted);
    font-size:12px;
  }
  .node-strike{
    stroke:var(--danger);
    stroke-width:2.2;
    pointer-events:none;
  }
  .node-alt-rect{
    fill:rgba(115,167,242,.22);
    stroke:var(--blue);
    stroke-width:1.2;
  }
  .node-alt-text{
    fill:var(--blue);
    font-size:11px;
    font-weight:800;
  }
  .node-alt-badge:hover .node-alt-rect{
    fill:rgba(115,167,242,.36);
  }
  .edge{
    fill:none;
    stroke:#506782;
    stroke-width:1.8;
  }
  .edge.highlight{
    stroke:#58c4b6;
    stroke-width:2.8;
  }
  .table-wrap{
    overflow:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:560px;
  }
  th,td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    text-align:left;
    vertical-align:middle;
    font-size:13px;
  }
  th{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-align:center;
  }
  td.num{
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  th.num{
    text-align:center;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .owned-input{
    width:86px;
    height:32px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    text-align:center;
    outline:none;
  }
  .material-cell{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    flex-wrap:nowrap;
    white-space:nowrap;
  }
  .material-cell img{
    width:26px;
    height:26px;
    border-radius:6px;
    object-fit:cover;
    background:var(--panel-2);
  }
  .material-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:800;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    min-height:22px;
    padding:2px 7px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    color:var(--soft);
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .tag.direct{
    color:#ffe2a0;
    border-color:rgba(229,190,95,.45);
    background:rgba(229,190,95,.1);
  }
  .tag.action{
    cursor:pointer;
  }
  .tag.crafted{
    color:#b6fff1;
    border-color:rgba(88,196,182,.42);
    background:rgba(88,196,182,.09);
  }
  .two-col{
    display:grid;
    grid-template-columns:minmax(240px,.8fr) minmax(340px,1fr) minmax(520px,1.45fr);
    gap:16px;
  }
  .state-cell{
    text-align:center;
    white-space:nowrap;
  }
  .method-cell{
    min-width:320px;
    text-align:left;
  }
  .method-list{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
  }
  .method-chip,.method-shop{
    display:inline-flex;
    align-items:center;
    gap:5px;
    max-width:100%;
    min-height:24px;
    padding:3px 8px;
    border:1px solid rgba(148,163,184,.24);
    border-radius:999px;
    background:rgba(15,23,42,.32);
    color:#d9e4f2;
    font-size:11px;
    font-weight:800;
    white-space:nowrap;
  }
  .method-shop{
    border-color:rgba(88,196,182,.32);
    background:rgba(88,196,182,.08);
  }
  .method-icon{
    width:18px;
    height:18px;
    border-radius:5px;
    object-fit:cover;
    flex:0 0 auto;
  }
  .method-icon.face{
    border-radius:50%;
    border:1px solid rgba(250,204,21,.42);
  }
  .exchange-mark{
    color:#facc15;
    font-weight:900;
  }
  #altTable tr.alt-row-method{
    background:rgba(229,190,95,.14);
    box-shadow:inset 3px 0 0 var(--accent-2);
  }
  #altTable tr.alt-row-method:hover{
    background:rgba(229,190,95,.2);
  }
  .alt-choice{
    width:100%;
    min-width:180px;
    margin-top:6px;
    height:28px;
    padding:0 8px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--soft);
    font-size:11px;
    font-weight:800;
  }
  .status-reset{
    margin-left:8px;
    min-height:24px;
    padding:4px 8px;
    font-size:11px;
  }
  .mabi-info{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }
  .mabi-info:empty{display:none}
  .npc-face{
    width:24px;
    height:24px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid rgba(250,204,21,.55);
    background:rgba(15,23,42,.55);
  }
  .source-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    max-width:100%;
    border:1px solid rgba(148,163,184,.24);
    border-radius:999px;
    padding:4px 8px;
    background:rgba(15,23,42,.34);
    color:#d9e4f2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .source-line{
    margin-top:8px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }
  .source-line strong{color:var(--text)}
  .source-line:empty{display:none}
  .step-list,.alt-list{
    display:grid;
    gap:10px;
  }
  .step{
    display:grid;
    grid-template-columns:32px minmax(0,1fr) auto;
    align-items:center;
    gap:10px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(255,255,255,.035);
  }
  .step-title{
    font-size:13px;
    font-weight:900;
    overflow-wrap:anywhere;
  }
  .step-sub{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
  }
  .alt-item{
    display:grid;
    gap:8px;
    padding:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:rgba(255,255,255,.035);
  }
  .alt-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
  }
  .empty{
    color:var(--muted);
    font-size:13px;
    line-height:1.55;
  }
  .toast{
    position:fixed;
    right:18px;
    bottom:18px;
    max-width:360px;
    padding:11px 13px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:rgba(18,25,39,.96);
    color:var(--ink);
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    font-size:13px;
  }
  .toast.show{
    opacity:1;
    transform:translateY(0);
  }
  @media (max-width:1080px){
    .app{grid-template-columns:1fr}
    .sidebar{
      position:relative;
      height:auto;
      border-right:0;
      border-bottom:1px solid var(--line);
    }
    .recipe-list{
      grid-template-columns:repeat(2,minmax(0,1fr));
      max-height:360px;
      overflow:auto;
    }
    .layout,.two-col{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .main{padding:16px}
    .topbar{grid-template-columns:1fr}
    .actions{justify-content:flex-start}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .recipe-list{grid-template-columns:1fr}
    .tree-svg{min-width:560px}
    .target-tools{grid-template-columns:minmax(0,1fr) 100px}
    h2{font-size:23px}
  }
  @media (max-width:460px){
    .stats{grid-template-columns:1fr}
    .qty-row{grid-template-columns:1fr 1fr}
    .title-line{align-items:flex-start}
  }
</style>
</head>

            <span class="badge" id="altBadge">0개</span>
          </div>

        <div class="panel-body table-wrap">
          <table>
            <thead>
              <tr>
                <th>가공품</th>

<script src="data.js"></script>
<script src="mabimobi-extracted-data.js"></script>
<script>
(() => {
  const rarity = {
    silver:{name:"일반", color:"var(--soft)"},
    green:{name:"고급", color:"var(--green)"},
    blue:{name:"레어", color:"var(--blue)"},
    purple:{name:"엘리트", color:"var(--purple)"},
    pink:{name:"에픽", color:"var(--pink)"},
    orange:{name:"전설", color:"var(--orange)"}
  };
  const state = {
    query:"",
    primaryCategory:"processing",
    secondaryCategory:"metal",
    sort:"name",
    membership:true,
    selectedId:"m9",
    targetQty:1,
    navStack:[],
    direct:new Set(),
    markedSecured:new Set(),
    owned:{},
    highlightKey:null,
    materialFocus:null,
    treeZoom:1,
    treePanX:0,
    treePanY:0,
    choices:{}
  };
  const nodeById = new Map(NODES.map(node => [node.id, node]));
  const extractedCatalog = window.MABIMOBI_ITEM_LIST || Object.values(window.MABIMOBI_ITEMS || {});
  const extractedCategoryLabel = info => info?.categoryLabel || ({
    Ingredient:"재료",
    Food:"음식",
    PetEquipment:"펫 장비",
    QuickSlot:"퀵슬롯"
  })[info?.category] || "추출 정보";
  const extractedCategory = info => {
    if(info?.itemType === "tool") return "craft_tool";
    if(info?.itemType === "equipment") return "craft_item";
    return info?.category === "Food" ? "cook_simple" : "craft_item";
  };
  const extractedNodeId = info => "ext:" + (info?.id || info?.sheetId || info?.name);
  const normalizedLookupName = value => String(value || "")
    .trim()
    .replace(/\s+(S|SS|Z|ZZ)$/i, "$1")
    .replace(/네크리스/g, "펜던트")
    .replace(/크레이스/g, "그레이스")
    .replace(/리인포스트/g, "리인포스드")
    .replace(/도르레/g, "도르래")
    .replace(/\s+/g, "");
  const extractedByName = new Map();
  const extractedByNormalizedName = new Map();
  extractedCatalog.forEach(info => {
    if(!info?.name) return;
    const name = String(info.name).trim();
    if(!extractedByName.has(name)) extractedByName.set(name, info);
    const normalized = normalizedLookupName(name);
    if(!extractedByNormalizedName.has(normalized)) extractedByNormalizedName.set(normalized, info);
  });
  const extractedNodes = extractedCatalog
    .filter(info => info && info.name && !nodeById.has(extractedNodeId(info)))
    .map(info => ({
      id:extractedNodeId(info),
      name:info.name,
      category:extractedCategory(info),
      externalOnly:true,
      externalCategoryLabel:extractedCategoryLabel(info),
      extractedInfo:info,
      type:"추출 정보",
      yield:1,
      time:"",
      materials:[]
    }));
  const existingNodeNames = new Set(NODES.map(node => String(node.name).trim()));
  const extractedDisplayNodes = extractedNodes.filter(infoNode => {
    const info = infoNode.extractedInfo;
    if(existingNodeNames.has(String(infoNode.name).trim())) return false;
    return info?.itemType === "equipment" || info?.itemType === "tool";
  });
  const allSearchNodes = [...NODES, ...extractedNodes.filter(infoNode => !existingNodeNames.has(String(infoNode.name).trim()))];
  const getNodeById = id => nodeById.get(id) || extractedNodes.find(node => node.id === id) || null;
  const categoryById = new Map(CATEGORIES.map(category => [category.id, category]));
  const PRIMARY_CATEGORIES = [
    { id:"processing", name:"가공", categories:["metal","wood","leather","cloth","potion","food"] },
    { id:"production", name:"제작", categories:["craft_item","cook_simple","cook_power","craft_tool"] }
  ];
  const SECONDARY_CATEGORIES = {
    processing:[
      { id:"metal", name:"금속 가공", categories:["metal"] },
      { id:"wood", name:"목재 가공", categories:["wood"] },
      { id:"leather", name:"가죽 가공", categories:["leather"] },
      { id:"cloth", name:"옷감 가공", categories:["cloth"] },
      { id:"potion", name:"약품 가공", categories:["potion"] },
      { id:"food", name:"식재료 가공", categories:["food"] }
    ],
    production:[
      { id:"weapon_craft", name:"무기 제작", categories:["craft_item"], group:"weapon" },
      { id:"armor_craft", name:"방어구 제작", categories:["craft_item"], group:"armor" },
      { id:"accessory_craft", name:"장신구 제작", categories:["craft_item"], group:"accessory" },
      { id:"craft_tool", name:"도구 제작", categories:["craft_tool"], group:"tool" },
      { id:"craft_item", name:"아이템 제작", categories:["craft_item"], group:"item" },
      { id:"cook_food", name:"음식 제작", categories:["cook_simple","cook_power"], group:"food" }
    ]
  };
  const producedKey = name => {
    const value = String(name).trim();
    const simpleAlias = value.match(/^(철괴)\(.+\)$/);
    if(simpleAlias) return simpleAlias[1];
    const crystalAlias = value.match(/^((?:광휘|불꽃|얼음|전기|봉인)의 결정)\(.+\)$/);
    if(crystalAlias) return crystalAlias[1];
    return value;
  };
  const producers = new Map();
  NODES.forEach(node => {
    const key = producedKey(node.name);
    if(!producers.has(key)) producers.set(key, []);
    producers.get(key).push(node);
  });
  const secondsOf = value => {
    if(!value) return 0;
    const h = value.match(/(\d+)\s*시간/);
    const m = value.match(/(\d+)\s*분/);
    const s = value.match(/(\d+)\s*초/);
    return (h ? Number(h[1]) * 3600 : 0) + (m ? Number(m[1]) * 60 : 0) + (s ? Number(s[1]) : 0);
  };
  const timeLabel = (node, count = 1) => {
    if(!node.time) return "즉시";
    const seconds = secondsOf(node.time) * count * (state.membership ? 1 : 2);
    return count === 1 ? formatSeconds(seconds) : formatSeconds(seconds);
  };
  const formatSeconds = value => {
    let total = Math.max(0, Math.round(value));
    const h = Math.floor(total / 3600);
    total -= h * 3600;
    const m = Math.floor(total / 60);
    const s = total - m * 60;
    const parts = [];
    if(h) parts.push(h + "시간");
    if(m) parts.push(m + "분");
    if(s || !parts.length) parts.push(s + "초");
    return parts.join(" ");
  };
  const formatNumber = value => new Intl.NumberFormat("ko-KR").format(value);
  const ICON_ALIASES = {
    "견고한 낫":"견고한 낫",
    "견고한 호미":"견고한 호미",
    "견고한 약초 괭이":"견고한 약초 괭이",
    "견고한 양털 가위":"견고한 양털 가위",
    "견고한 벌목 도끼":"견고한 벌목 도끼",
    "견고한 곡괭이":"견고한 곡괭이",
    "견고한 곤충 채집망":"견고한 곤충 채집망",
    "견고한 낚싯대":"견고한 낚싯대",
    "염색약":"환영 가루",
    "호박 수프":"호박 수프",
    "풍미 가득 스테이크":"풍미 가득 스테이크"
  };
  const iconName = item => {
    const node = typeof item === "object" && item ? item : null;
    const name = node ? node.name : item;
    if(name === "최상급 붕대"){
      return node && node.yield === 5 ? "최상급 붕대5" : "최상급 붕대10";
    }
    return ICON_ALIASES[name] || name;
  };
  const iconPath = item => "icons/" + iconName(item) + ".png";
  const extractedInfo = item => {
    const node = typeof item === "object" && item ? item : null;
    if(node?.extractedInfo) return node.extractedInfo;
    const name = node ? node.name : item;
    if(!name || !window.MABIMOBI_ITEMS) return null;
    const key = producedKey(name);
    const trimmed = String(name).trim();
    return window.MABIMOBI_ITEMS[key]
      || window.MABIMOBI_ITEMS[trimmed]
      || extractedByName.get(key)
      || extractedByName.get(trimmed)
      || extractedByNormalizedName.get(normalizedLookupName(key))
      || extractedByNormalizedName.get(normalizedLookupName(trimmed))
      || null;
  };
  const extractedIconPath = item => extractedInfo(item)?.iconUrl || null;
  const materialIconPath = item => extractedIconPath(item) || iconPath(item);
  const shortSourceText = info => {
    const lines = (info?.obtain || []).filter(Boolean);
    if(!lines.length) return "";
    const compact = lines.filter(line => !/^획득$/.test(line)).slice(0, 8).join(" · ");
    return compact.length > 120 ? compact.slice(0, 119) + "…" : compact;
  };
  const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
  const assetUrl = url => {
    if(!url) return "";
    return String(url).startsWith("/assets/") ? "https://mabimobi.life" + url : String(url);
  };
  const normalizedObtainText = (text, key) => {
    let value = String(text || "").trim();
    if(!value || value === "획득" || value.includes("상자")) return "";
    value = value.replace(/^획득\s*[·:]\s*/,"").trim();
    if(value.startsWith("제작")) return "";
    if(value.includes("·")){
      const parts = value.split("·").map(part => part.trim()).filter(Boolean);
      value = parts[parts.length - 1] || value;
    }
    value = value.replace(/^[^-–:]+[-–]\s*/,"").trim();
    if(["상점 구매","설비 생산","제작","획득"].includes(value)) return "";
    if(/^(일간|주간|월간|캐릭터|계정)\s*/.test(value)) return "";
    return !value || value === key ? "" : value;
  };
  const sourceMethodText = (source, key) => {
    if(!source || source.isShop || source.method === "open_box") return "";
    const joined = [source.summary, source.label, source.detail].filter(Boolean).join(" ");
    if(joined.includes("상자")) return "";
    if(source.method === "produce" && source.label) return source.label;
    return normalizedObtainText(source.label || source.detail || source.summary, key);
  };
  const methodPieces = key => {
    const info = extractedInfo(key);
    const seen = new Set();
    const pieces = [];
    const addPiece = (signature, html) => {
      if(!signature || seen.has(signature)) return;
      seen.add(signature);
      pieces.push(html);
    };
    (info?.obtainSources || []).forEach(source => {
      const text = sourceMethodText(source, key);
      if(text) addPiece("text:" + text, `<span class="method-chip" title="${escapeHtml(text)}">${escapeHtml(text)}</span>`);
    });
    (info?.obtainSources || []).forEach(source => {
      if(!source?.isShop) return;
      const place = source.shopName || source.label || source.npcName || "상점";
      const price = source.price ?? source.quantity ?? "";
      const currencyName = source.currencyName || "";
      const limit = source.limit ? ` (${source.limit})` : "";
      const signature = ["shop", place, price, currencyName, source.limit].join("|");
      const face = source.npcFaceUrl ? `<img class="method-icon face" src="${assetUrl(source.npcFaceUrl)}" alt="">` : "";
      const currencyIcon = source.currencyIconUrl ? `<img class="method-icon" src="${assetUrl(source.currencyIconUrl)}" alt="">` : "";
      const priceText = price !== "" && price !== null ? `${formatNumber(price)}${currencyName ? " " : ""}` : "";
      const label = `${escapeHtml(place)}:`;
      const payment = `${priceText}${escapeHtml(currencyName)}${escapeHtml(limit)}`;
      addPiece(signature, `<span class="method-shop">${face}<span>${label}</span><span class="exchange-mark">↔</span>${currencyIcon}<span>${payment}</span></span>`);
    });
    (info?.obtain || []).forEach(line => {
      const text = normalizedObtainText(line, key);
      const duplicatedSource = (info?.obtainSources || []).some(source => text && (text === source.label || text === source.shopName || text === source.summary));
      if(duplicatedSource) return;
      if(text) addPiece("text:" + text, `<span class="method-chip" title="${escapeHtml(text)}">${escapeHtml(text)}</span>`);
    });
    return pieces;
  };
  const hasObtainMethod = key => methodPieces(key).length > 0;
  const methodDisplayHtml = key => {
    const pieces = methodPieces(key);
    return pieces.length ? `<div class="method-list">${pieces.join("")}</div>` : `<span class="muted">확인 필요</span>`;
  };
  const displayTime = (node, count = 1) => node.time ? timeLabel(node, count) : "즉시";
  const tierCache = new Map();
  const tierOf = id => {
    if(tierCache.has(id)) return tierCache.get(id);
    const node = nodeById.get(id);
    if(!node || !node.materials) return 1;
    let max = 0;
    node.materials.forEach(material => {
      const producer = pickProducer(material.name);
      if(producer && producer.id !== id) max = Math.max(max, tierOf(producer.id));
    });
    tierCache.set(id, max + 1);
    return max + 1;
  };
  const pickProducer = materialName => {
    const key = producedKey(materialName);
    const list = producers.get(key);
    if(!list || !list.length) return null;
    const chosenId = state.choices[key];
    if(chosenId) return list.find(node => node.id === chosenId) || list[0];
    return [...list].sort((a,b) => secondsOf(a.time) - secondsOf(b.time) || a.materials.length - b.materials.length)[0];
  };
  const categoryLabel = node => {
    if(node.externalOnly) return node.externalCategoryLabel || "추출 정보";
    if(["cook_simple","cook_power"].includes(node.category)) return "음식 제작";
    if(node.category === "craft_item"){
      const group = productionGroupOf(node);
      if(group === "weapon") return "무기 제작";
      if(group === "armor") return "방어구 제작";
      if(group === "accessory") return "장신구 제작";
      return "아이템 제작";
    }
    if(node.category === "craft_tool") return "도구 제작";
    const category = categoryById.get(node.category);
    return category ? category.icon + " " + category.name : node.category;
  };
  const directAllowed = name => producers.has(producedKey(name));
  const addMap = (map, key, amount, meta) => {
    if(!map.has(key)) map.set(key, {...meta, qty:0});
    map.get(key).qty += amount;
  };
  const addCraft = (map, node, key, count, produced) => {
    if(!map.has(node.id)) map.set(node.id, {node, key, count:0, produced:0});
    const row = map.get(node.id);
    row.count += count;
    row.produced += produced;
  };
  function calculate(node, amount){
    const raw = new Map();
    const crafts = new Map();
    const visits = new Set();
    const tree = buildNeed(node, amount, true, visits, raw, crafts);
    const craftRows = [...crafts.values()].sort((a,b) => tierOf(a.node.id) - tierOf(b.node.id) || a.node.name.localeCompare(b.node.name, "ko"));
    const rawRows = [...raw.values()].sort((a,b) => b.qty - a.qty || a.name.localeCompare(b.name, "ko"));
    const totalTime = craftRows.reduce((sum,row) => sum + row.count * secondsOf(row.node.time) * (state.membership ? 1 : 2), 0);
    const unknownTimeCount = craftRows.filter(row => !row.node.time).length;
    return {tree, rawRows, craftRows, totalTime, unknownTimeCount};
  }
  function buildNeed(node, amount, isTarget, visits, raw, crafts){
    const key = producedKey(node.name);
    const count = Math.ceil(amount / node.yield);
    const produced = count * node.yield;
    const direct = !isTarget && state.direct.has(key);
    const current = {
      id:node.id,
      name:node.name,
      key,
      required:amount,
      produced,
      count,
      node,
      direct,
      children:[]
    };
    if(direct){
      addMap(raw, key, amount, {name:key, kind:"direct", source:node});
      if(!visits.has(node.id)){
        const nextVisits = new Set(visits);
        nextVisits.add(node.id);
        current.children = buildDisplayChildren(node, count, nextVisits);
      }
      return current;
    }
    addCraft(crafts, node, key, count, produced);
    if(visits.has(node.id)) return current;
    const nextVisits = new Set(visits);
    nextVisits.add(node.id);
    (node.materials || []).forEach(material => {
      const needed = material.qty * count;
      const producer = pickProducer(material.name);
      if(producer && producer.id !== node.id){
        current.children.push(buildNeed(producer, needed, false, nextVisits, raw, crafts));
      }else{
        addMap(raw, material.name, needed, {name:material.name, kind:"raw"});
        current.children.push({
          id:"raw-" + material.name,
          name:material.name,
          key:material.name,
          required:needed,
          produced:needed,
          count:0,
          node:null,
          direct:true,
          children:[]
        });
      }
    });
    return current;
  }
  function buildDisplayChildren(node, count, visits){
    return (node.materials || []).map(material => {
      const needed = material.qty * count;
      const producer = pickProducer(material.name);
      if(producer && producer.id !== node.id){
        return buildDisplayNode(producer, needed, visits);
      }
      return {
        id:"raw-" + material.name,
        name:material.name,
        key:material.name,
        required:needed,
        produced:needed,
        count:0,
        node:null,
        direct:true,
        children:[]
      };
    });
  }
  function buildDisplayNode(node, amount, visits){
    const key = producedKey(node.name);
    const count = Math.ceil(amount / node.yield);
    const produced = count * node.yield;
    const current = {
      id:node.id,
      name:node.name,
      key,
      required:amount,
      produced,
      count,
      node,
      direct:state.direct.has(key),
      children:[]
    };
    if(visits.has(node.id)) return current;
    const nextVisits = new Set(visits);
    nextVisits.add(node.id);
    current.children = buildDisplayChildren(node, count, nextVisits);
    return current;
  }
  const el = id => document.getElementById(id);
  function activeSecondary(){
    const list = SECONDARY_CATEGORIES[state.primaryCategory] || SECONDARY_CATEGORIES.processing;
    return list.find(item => item.id === state.secondaryCategory) || list[0];
  }
  function productionGroupOf(node){
    if(["cook_simple","cook_power"].includes(node.category)) return "food";
    if(node.category === "craft_tool" || node.type === "생활 도구") return "tool";
    if(node.category !== "craft_item") return null;
    const info = extractedInfo(node);
    if(info?.itemType === "equipment"){
      if(info.categoryLabel === "무기") return "weapon";
      if(["상의","하의","모자","장갑","신발"].includes(info.categoryLabel)) return "armor";
      if(["목걸이","반지","장신구"].includes(info.categoryLabel)) return "accessory";
    }
    if(info?.itemType === "tool") return "tool";
    const section = node.section || "";
    const type = node.type || "";
    if(["반지","목걸이"].includes(type) || /(?:링|네크리스|목걸이|반지)$/.test(node.name)) return "accessory";
    if(/(?:중갑|경갑|천옷|방어구|갑옷)/.test(section) || /(?:투구|상의|장갑|하의|신발|갑옷|로브|방패)/.test(node.name)) return "armor";
    if(/(?:대장 기술|목공|매직 크래프트)/.test(section) || /(?:검술사|대검전사|전사|궁수|장궁병|석궁사수|마법사|악사|음유시인|댄서)/.test(type)) return "weapon";
    return "item";
  }
  function secondaryMatchesNode(secondary, node){
    if(!secondary.categories.includes(node.category)) return false;
    return !secondary.group || productionGroupOf(node) === secondary.group;
  }
  function activeCategoryIds(){
    return new Set(activeSecondary().categories);
  }
  function activeSecondaryMatches(node){
    return secondaryMatchesNode(activeSecondary(), node);
  }
  function secondaryForNode(node){
    for(const [primaryId, categories] of Object.entries(SECONDARY_CATEGORIES)){
      const secondary = categories.find(item => secondaryMatchesNode(item, node));
      if(secondary) return {primaryId, secondaryId:secondary.id};
    }
    return null;
  }
  function secondaryCategoryLabel(node){
    const match = secondaryForNode(node);
    if(!match) return categoryLabel(node);
    const secondary = SECONDARY_CATEGORIES[match.primaryId].find(item => item.id === match.secondaryId);
    return secondary?.name || categoryLabel(node);
  }
  function syncCategoryToNode(node){
    const match = secondaryForNode(node);
    if(!match) return;
    state.primaryCategory = match.primaryId;
    state.secondaryCategory = match.secondaryId;
  }
  function clearTreeFocus(){
    state.highlightKey = null;
    state.materialFocus = null;
  }
  function nodePathStr(node){
    return (node.path || [node.key]).join(">");
  }
  function isPathMarked(path){
    let acc = "";
    for(let i = 0; i < path.length; i++){
      acc = i === 0 ? path[0] : acc + ">" + path[i];
      if(state.markedSecured.has(acc)) return true;
    }
    return false;
  }
  function toggleSecuredSubtree(node){
    if(!node.node) return;
    const pathStr = nodePathStr(node);
    if(state.markedSecured.has(pathStr)) state.markedSecured.delete(pathStr);
    else state.markedSecured.add(pathStr);
  }
  function nodeSearchMatches(query){
    const value = query.trim().toLowerCase();
    if(!value) return [];
    const starts = allSearchNodes.filter(node => node.name.toLowerCase().startsWith(value));

        ...(node.materials || []).map(item => item.name),
        info?.rarity,
        info?.categoryLabel,
        ...(info?.obtain || [])
      ].join(" ").toLowerCase();
      return haystack.includes(value);
    });
    return [
      ...starts.sort((a,b) => a.name.localeCompare(b.name, "ko")),
      ...includes.sort((a,b) => a.name.localeCompare(b.name, "ko"))

  function findTreeItemByUid(tree, targetUid){
    if(!tree || !targetUid) return null;
    const levels = [];
    let match = null;
    const walk = (item, depth) => {
      if(!levels[depth]) levels[depth] = [];
      const uid = item.id + "-" + depth + "-" + levels[depth].length;
      levels[depth].push(item);
      if(uid === targetUid) match = item;
      item.children.forEach(child => walk(child, depth + 1));
    };
    walk(tree, 0);
    return match;
  }
  function materialRowsForFocus(result){
    const currentFocus = findTreeItemByUid(result.tree, state.highlightKey);
    if(state.highlightKey && !currentFocus){
      clearTreeFocus();
      return result.rawRows;
    }
    const focus = currentFocus || state.materialFocus;
    if(!focus) return result.rawRows;
    if(focus.node || focus.nodeId){
      const node = focus.node || nodeById.get(focus.nodeId);
      if(node) return calculate(node, Math.max(1, focus.required || node.yield || 1)).rawRows;
    }
    if(focus.key){
      const key = producedKey(focus.key);
      return [{
        name:focus.key,
        key,
        qty:Math.max(0, focus.required || 0),
        kind:"raw"
      }];
    }
    return result.rawRows;
  }

  function collectAlternativeKeys(result){
    const keys = new Set();
    const visit = tree => {
      if(!tree) return;
      if(producers.has(tree.key) && producers.get(tree.key).length > 1) keys.add(tree.key);
      tree.children.forEach(visit);

    return [...keys].sort((a,b) => a.localeCompare(b, "ko"));

  function alternativeRows(result){
    const targetKey = producedKey(getNodeById(state.selectedId)?.name || "");
    const rowsByKey = new Map();
    const addTreeItem = (item, isRoot = false) => {
      if(!item) return;
      const key = producedKey(item.key || item.name);
      if(!isRoot && key !== targetKey && item.node && producers.has(key)){
        if(!rowsByKey.has(key)) rowsByKey.set(key, {
          key,
          node:pickProducer(key) || item.node,
          qty:0,
          count:0,
          produced:0
        });
        const entry = rowsByKey.get(key);
        entry.qty += item.required;
        entry.count += item.count;
        entry.produced += item.produced;
      }
      item.children.forEach(child => addTreeItem(child, false));
    };
    addTreeItem(result.tree, true);
    result.craftRows.forEach(row => {
      const key = producedKey(row.node.name);
      if(key === targetKey || rowsByKey.has(key)) return;
      if(!rowsByKey.has(key)) rowsByKey.set(key, {
        key,
        node:pickProducer(key) || row.node,
        qty:0,
        count:0,
        produced:0
      });
      const entry = rowsByKey.get(key);
      entry.qty += row.produced;
      entry.count += row.count;
      entry.produced += row.produced;
    });
    collectAlternativeKeys(result).forEach(key => {
      if(key === targetKey) return;
      if(!rowsByKey.has(key)){
        const node = pickProducer(key);
        if(node) rowsByKey.set(key, {key, node, qty:node.yield, count:1, produced:node.yield});
      }
    });
    result.rawRows.forEach(row => {
      const key = producedKey(row.name);
      if(key === targetKey || rowsByKey.has(key)) return;
      if(hasObtainMethod(key)){
        rowsByKey.set(key, {key, node:pickProducer(key), qty:row.qty, count:0, produced:row.qty});
      }
    });
    if(targetKey && !rowsByKey.has(targetKey)){
      const hasAltProducers = producers.has(targetKey) && producers.get(targetKey).length > 1;
      if(hasAltProducers || hasObtainMethod(targetKey)){
        rowsByKey.set(targetKey, {
          key:targetKey,
          node:result.tree.node || pickProducer(targetKey),
          qty:result.tree.required,
          count:result.tree.count,
          produced:result.tree.produced
        });
      }
    }
    const targetHighlighted = targetKey && hasObtainMethod(targetKey) && rowsByKey.has(targetKey);
    return [...rowsByKey.values()].sort((a,b) => {
      if(targetHighlighted){
        if(a.key === targetKey) return -1;
        if(b.key === targetKey) return 1;
      }
      return a.key.localeCompare(b.key, "ko");
    });
  }

  function drawTree(tree){
    const svg = el("treeSvg");
    svg.innerHTML = "";
    const levels = [];
    const seen = new Map();
    const walk = (node, depth, parentPath) => {
      if(!levels[depth]) levels[depth] = [];
      const path = parentPath.concat(node.key);
      const copy = {...node, depth, uid:node.id + "-" + depth + "-" + levels[depth].length, path};
      levels[depth].push(copy);
      seen.set(copy.uid, copy);
      copy.childrenRefs = node.children.map(child => walk(child, depth + 1, path));
      return copy.uid;
    };
    const rootId = walk(tree, 0, []);
    const flat = [...seen.values()];
    const nodeWidth = 236;
    const nodeHeight = 68;
    const levelGap = 288;
    const rowGap = 104;
    const width = Math.max(760, levels.length * levelGap + 100);
    const height = Math.max(460, Math.max(...levels.map(list => list.length)) * rowGap + 90);
    svg.setAttribute("width", "100%");
    svg.setAttribute("height", String(height));
    svg.style.width = "";
    svg.style.height = "100%";
    svg.dataset.mapWidth = String(width);
    svg.dataset.mapHeight = String(height);
    applyTreeViewBox(svg);
    levels.forEach((list, depth) => {
      const gap = height / (list.length + 1);
      list.forEach((node, index) => {
        node.x = 44 + depth * levelGap;
        node.y = gap * (index + 1);
      });
    });
    const highlightedUids = new Set();
    const highlightedEdges = new Set();
    const markHighlightPath = uid => {
      const current = seen.get(uid);
      if(!current) return false;
      if(uid === state.highlightKey){
        highlightedUids.add(uid);
        return true;
      }
      for(const childId of current.childrenRefs){
        if(markHighlightPath(childId)){
          highlightedUids.add(uid);
          highlightedEdges.add(uid + ">" + childId);
          return true;
        }
      }
      return false;
    };
    if(state.highlightKey) markHighlightPath(rootId);
    flat.forEach(node => {
      node.childrenRefs.forEach(childId => {
        const child = seen.get(childId);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const x1 = node.x + nodeWidth;
        const x2 = child.x;
        const mx = (x1 + x2) / 2;
        path.setAttribute("class", "edge" + (highlightedEdges.has(node.uid + ">" + childId) ? " highlight" : ""));
        path.setAttribute("d", `M${x1},${node.y} C${mx},${node.y} ${mx},${child.y} ${x2},${child.y}`);
        svg.appendChild(path);
      });
    });
    flat.forEach(node => {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("role", "button");
      group.style.cursor = "pointer";
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", node.x);
      rect.setAttribute("y", node.y - nodeHeight / 2);
      rect.setAttribute("width", String(nodeWidth));
      rect.setAttribute("height", String(nodeHeight));
      rect.setAttribute("rx", "8");
      const isRootNode = node.uid === rootId;
      const directCascaded = !isRootNode && node.path.some(key => state.direct.has(key));
      const pathMarked = !isRootNode && isPathMarked(node.path);
      const isStruck = directCascaded || pathMarked;
      rect.setAttribute("class", "node-card" + (node.id === state.selectedId ? " target" : "") + (node.direct && node.node ? " direct" : "") + (highlightedUids.has(node.uid) ? " highlight" : "") + (isStruck ? " struck" : ""));
      group.appendChild(rect);
      const image = document.createElementNS("http://www.w3.org/2000/svg", "image");
      const iconSize = nodeHeight - 8;
      image.setAttribute("x", node.x + 6);
      image.setAttribute("y", node.y - iconSize / 2);
      image.setAttribute("width", String(iconSize));
      image.setAttribute("height", String(iconSize));
      image.setAttribute("preserveAspectRatio", "xMidYMid meet");
      image.setAttribute("class", "node-icon");
      image.setAttribute("href", materialIconPath(node.node || node.key));
      image.addEventListener("error", () => image.remove());
      group.appendChild(image);
      const textX = node.x + iconSize + 16;
      const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
      title.setAttribute("x", textX);
      title.setAttribute("y", node.y - 10);
      title.setAttribute("class", "node-text");
      title.textContent = trimText(node.key, 15);
      group.appendChild(title);
      const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
      sub.setAttribute("x", textX);
      sub.setAttribute("y", node.y + 16);
      sub.setAttribute("class", "node-sub");
      sub.textContent = node.node ? `${formatNumber(node.required)}개 필요 · ${formatNumber(node.count)}회` : `${formatNumber(node.required)}개`;
      group.appendChild(sub);
      if(isStruck){
        const strike = document.createElementNS("http://www.w3.org/2000/svg", "line");
        strike.setAttribute("x1", textX);
        strike.setAttribute("x2", node.x + nodeWidth - 12);
        strike.setAttribute("y1", node.y - 7);
        strike.setAttribute("y2", node.y - 7);
        strike.setAttribute("class", "node-strike");
        group.appendChild(strike);
      }
      const altList = node.node ? (producers.get(node.key) || []) : [];
      if(altList.length > 1){
        const badgeW = 34, badgeH = 20;
        const badgeX = node.x + nodeWidth - badgeW - 6;
        const badgeY = node.y - nodeHeight / 2 + 6;
        const altGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        altGroup.setAttribute("class", "node-alt-badge");
        altGroup.style.cursor = "pointer";
        const altRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        altRect.setAttribute("x", badgeX);
        altRect.setAttribute("y", badgeY);
        altRect.setAttribute("width", badgeW);
        altRect.setAttribute("height", badgeH);
        altRect.setAttribute("rx", 6);
        altRect.setAttribute("class", "node-alt-rect");
        altGroup.appendChild(altRect);
        const altText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        altText.setAttribute("x", badgeX + badgeW / 2);
        altText.setAttribute("y", badgeY + badgeH / 2 + 4);
        altText.setAttribute("text-anchor", "middle");
        altText.setAttribute("class", "node-alt-text");
        altText.textContent = "⇄" + altList.length;
        altGroup.appendChild(altText);
        const selectedProducer = pickProducer(node.key);
        const titleEl = document.createElementNS("http://www.w3.org/2000/svg", "title");
        titleEl.textContent = `제작 방법 ${altList.length}종 (현재: ${selectedProducer ? selectedProducer.name : node.key}) · 클릭하여 전환`;
        altGroup.appendChild(titleEl);
        altGroup.addEventListener("click", event => {
          event.stopPropagation();
          const currentId = state.choices[node.key] || (selectedProducer && selectedProducer.id);
          const idx = altList.findIndex(item => item.id === currentId);

        group.appendChild(altGroup);

      group.addEventListener("click", () => {

        if(!isRoot) toggleSecuredSubtree(node);

      });
      svg.appendChild(group);
    });
    svg.dataset.root = rootId;

    render();
  });
  el("membershipToggle").addEventListener("click", () => {
    state.membership = !state.membership;
    render();
  });
  el("targetQty").addEventListener("input", event => {
    state.targetQty = Math.max(1, Math.floor(Number(event.target.value) || 1));
    render();
  });
  el("sortNameBtn").addEventListener("click", () => { state.sort = "name"; render(); });
  el("sortTimeBtn").addEventListener("click", () => { state.sort = "time"; render(); });
  el("sortTierBtn").addEventListener("click", () => { state.sort = "tier"; render(); });
  function resetSecuredState(){
    state.direct.clear();
    state.markedSecured.clear();
    state.owned = {};
    render();
  }
  el("resetDirectBtn").addEventListener("click", resetSecuredState);
  el("resetRawBtn").addEventListener("click", resetSecuredState);
  const treeSvg = el("treeSvg");
  const treeWrap = treeSvg.parentElement;
  function treeMapSize(){
    return {
      width:Number(treeSvg.dataset.mapWidth) || 760,
      height:Number(treeSvg.dataset.mapHeight) || 460
    };
  }
  function applyTreeViewBox(svg = treeSvg){
    const map = treeMapSize();
    const zoom = Math.min(2.4, Math.max(0.55, state.treeZoom || 1));
    state.treeZoom = zoom;
    const viewWidth = map.width / zoom;
    const viewHeight = map.height / zoom;
    const panPadX = viewWidth * 0.45;
    const panPadY = viewHeight * 0.45;
    const minPanX = -panPadX;
    const minPanY = -panPadY;
    const maxPanX = Math.max(0, map.width - viewWidth) + panPadX;
    const maxPanY = Math.max(0, map.height - viewHeight) + panPadY;
    state.treePanX = Math.min(maxPanX, Math.max(minPanX, state.treePanX || 0));
    state.treePanY = Math.min(maxPanY, Math.max(minPanY, state.treePanY || 0));
    svg.setAttribute("viewBox", `${state.treePanX} ${state.treePanY} ${viewWidth} ${viewHeight}`);
  }
  function treePointFromEvent(event){
    const rect = treeSvg.getBoundingClientRect();
    const map = treeMapSize();
    const viewWidth = map.width / (state.treeZoom || 1);
    const viewHeight = map.height / (state.treeZoom || 1);
    return {
      x:state.treePanX + ((event.clientX - rect.left) / rect.width) * viewWidth,
      y:state.treePanY + ((event.clientY - rect.top) / rect.height) * viewHeight,
      ratioX:(event.clientX - rect.left) / rect.width,
      ratioY:(event.clientY - rect.top) / rect.height,
      viewWidth,
      viewHeight
    };
  }
  treeWrap.addEventListener("wheel", event => {
    if(!lastResult) return;
    event.preventDefault();
    const point = treePointFromEvent(event);
    const oldZoom = state.treeZoom || 1;
    const nextZoom = Math.min(2.4, Math.max(0.55, oldZoom * (event.deltaY < 0 ? 1.12 : 1 / 1.12)));
    if(Math.abs(nextZoom - oldZoom) < 0.001) return;
    const map = treeMapSize();
    state.treeZoom = nextZoom;
    state.treePanX = point.x - point.ratioX * (map.width / nextZoom);
    state.treePanY = point.y - point.ratioY * (map.height / nextZoom);
    applyTreeViewBox();
  }, {passive:false});
  let treeDrag = null;
  let treeDragBlockClick = false;
  treeWrap.addEventListener("pointerdown", event => {
    if(event.button !== 0) return;
    const point = treePointFromEvent(event);
    treeDrag = {
      id:event.pointerId,
      x:event.clientX,
      y:event.clientY,
      panX:state.treePanX,
      panY:state.treePanY,
      viewWidth:point.viewWidth,
      viewHeight:point.viewHeight,
      moved:false,
      captured:false
    };
    treeWrap.classList.add("dragging");
  });
  treeWrap.addEventListener("pointermove", event => {
    if(!treeDrag || event.pointerId !== treeDrag.id) return;
    const dx = event.clientX - treeDrag.x;
    const dy = event.clientY - treeDrag.y;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) treeDrag.moved = true;
    if(!treeDrag.moved) return;
    if(!treeDrag.captured){
      treeWrap.setPointerCapture(event.pointerId);
      treeDrag.captured = true;
    }
    event.preventDefault();
    const rect = treeSvg.getBoundingClientRect();
    state.treePanX = treeDrag.panX - (dx / rect.width) * treeDrag.viewWidth;
    state.treePanY = treeDrag.panY - (dy / rect.height) * treeDrag.viewHeight;
    applyTreeViewBox();
  });
  const finishTreeDrag = event => {
    if(!treeDrag || event.pointerId !== treeDrag.id) return;
    if(treeDrag.moved){
      treeDragBlockClick = true;
      window.setTimeout(() => { treeDragBlockClick = false; }, 0);
    }
    treeWrap.classList.remove("dragging");
    if(treeWrap.hasPointerCapture(event.pointerId)) treeWrap.releasePointerCapture(event.pointerId);
    treeDrag = null;
  };
  treeWrap.addEventListener("pointerup", finishTreeDrag);
  treeWrap.addEventListener("pointercancel", finishTreeDrag);
  treeWrap.addEventListener("click", event => {
    if(!treeDragBlockClick) return;
    event.preventDefault();
    event.stopPropagation();
    treeDragBlockClick = false;
  }, true);
  render();
})();
</script>
<script>
  (function(){
    if(window.parent === window) return;
    let pending = false;
    function reportHeight(){
      if(pending) return;
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        window.parent.postMessage({type:"mabinogi-techtree-height", height:document.documentElement.scrollHeight}, "*");
      });
    }
    window.addEventListener("load", reportHeight);
    window.addEventListener("resize", reportHeight);
    new MutationObserver(reportHeight).observe(document.body, {childList:true, subtree:true, attributes:true});
    reportHeight();
  })();
</script>
