<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마비노기 모바일 시즌2 장비 제작 플래너</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafb;
      --surface: #fffefd;
      --surface-2: #f2f6fb;
      --ink: #18202a;
      --muted: #687382;
      --line: #dde5ee;
      --red: #c94c4c;
      --red-soft: #ffe9e8;
      --yellow: #b87a00;
      --yellow-soft: #fff2c9;
      --blue: #256fd2;
      --blue-2: #e5f0ff;
      --green: #198a57;
      --green-soft: #e0f6ea;
      --pink: #cb4f91;
      --pink-soft: #ffe7f3;
      --teal: var(--green);
      --teal-2: var(--green-soft);
      --amber: var(--yellow);
      --amber-2: var(--yellow-soft);
      --shadow: 0 16px 40px rgba(35, 55, 77, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      border: 0;
      outline: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      overflow-x: hidden;
      box-shadow: none;
    }

    html {
      border: 0;
      outline: 0;
      overflow-x: hidden;
      box-shadow: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
    }

    .top {
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(201, 76, 76, 0.10), rgba(184, 122, 0, 0.10) 24%, rgba(37, 111, 210, 0.10) 50%, rgba(25, 138, 87, 0.10) 74%, rgba(203, 79, 145, 0.10)),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    }

    .title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(25px, 3.4vw, 36px);
      font-weight: 820;
      letter-spacing: 0;
    }

    .creator-credit {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
      color: var(--red);
      font-size: 13px;
      font-weight: 760;
    }

    .creator-avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(24, 32, 42, 0.08);
      flex: 0 0 auto;
    }

    .creator-name {
      color: var(--ink);
    }

    .btn {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-weight: 720;
      font-size: 13px;
      white-space: nowrap;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.75) inset;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--blue), var(--green));
      color: #ffffff;
      border-color: #2e82cc;
    }

    .btn.ghost {
      background: transparent;
    }

    .btn.small {
      min-height: 30px;
      padding: 0 9px;
      font-size: 12px;
    }

    .btn:disabled {
      cursor: wait;
      opacity: 0.68;
    }

    #refreshMarket,
    #refreshEquipmentMarket {
      min-height: 30px;
      padding: 0 9px;
      font-size: 12px;
    }

    main {
      padding: 14px 0 28px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      min-width: 0;
    }

    .dashboard > * {
      min-width: 0;
    }

    .panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel-head {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 820;
      letter-spacing: 0;
    }

    .target-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .gear-set-tabs {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .gear-set-tab {
      min-height: 30px;
      padding: 0 12px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .gear-set-tab.active {
      background: var(--blue-2);
      color: var(--blue);
      box-shadow: 0 1px 6px rgba(37, 111, 210, 0.12);
    }

    .market-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
    }

    body.equipment-view-active .panel-head .market-tools {
      display: none;
    }

    .equipment-panel-tools {
      display: none;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
    }

    body.equipment-view-active .equipment-panel-tools {
      display: flex;
    }

    .market-progress {
      width: min(310px, 46vw);
      min-width: 220px;
      display: grid;
      gap: 5px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
      white-space: nowrap;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green));
      transition: width 180ms ease;
    }

    .market-progress.ok .progress-bar {
      background: linear-gradient(90deg, var(--green), #36b479);
    }

    .market-progress.warn .progress-bar {
      background: linear-gradient(90deg, var(--yellow), #d79621);
    }

    .market-progress.error .progress-bar {
      background: linear-gradient(90deg, var(--red), #dc6a6a);
    }

    .panel-body {
      padding: 12px 18px 14px;
    }

    .gear-grid {
      display: grid;
      gap: 8px;
    }

    .gear-group {
      --group-color: var(--blue);
      --group-soft: var(--blue-2);
      min-width: 0;
      padding: 7px;
      border: 1px solid color-mix(in srgb, var(--group-color) 26%, var(--line));
      border-radius: 8px;
      background: #ffffff;
    }

    .gear-group.group-weapon {
      --group-color: #d64242;
      --group-soft: #ffe5e5;
    }

    .gear-group.group-armor {
      --group-color: #b87900;
      --group-soft: #fff2c9;
    }

    .gear-group.group-accessory {
      --group-color: #256fd2;
      --group-soft: #e5f0ff;
    }

    .gear-group.group-warrior {
      --group-color: #d64242;
      --group-soft: #ffe5e5;
    }

    .gear-group.group-archer {
      --group-color: #198a57;
      --group-soft: #e0f6ea;
    }

    .gear-group.group-mage {
      --group-color: #256fd2;
      --group-soft: #e5f0ff;
    }

    .gear-group.group-healer {
      --group-color: #cb4f91;
      --group-soft: #ffe7f3;
    }

    .gear-group.group-bard {
      --group-color: #b87900;
      --group-soft: #fff2c9;
    }

    .gear-group.group-rogue {
      --group-color: #646b78;
      --group-soft: #eef1f5;
    }

    .gear-group-label {
      margin: 0 0 5px 2px;
      color: var(--group-color);
      font-size: 13px;
      font-weight: 850;
      word-break: keep-all;
    }

    .gear-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      min-width: 0;
    }

    .gear-toggle {
      --item-color: var(--blue);
      --item-soft: var(--blue-2);
      width: 100%;
      min-width: 0;
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 9px;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--item-color) 26%, var(--line));
      background: rgba(255, 255, 255, 0.78);
      color: color-mix(in srgb, var(--item-color) 78%, var(--ink));
      font-size: 14px;
      text-align: center;
      overflow: hidden;
    }

    .gear-toggle[data-id="drakein-dualblade"] .gear-name {
      font-size: 12px;
      white-space: nowrap;
      overflow-wrap: normal;
    }

    .gear-toggle.kind-weapon {
      --item-color: #d64242;
      --item-soft: #ffe5e5;
    }

    .gear-toggle.kind-armor {
      --item-color: #b87900;
      --item-soft: #fff2c9;
    }

    .gear-toggle.kind-accessory {
      --item-color: #256fd2;
      --item-soft: #e5f0ff;
    }

    .gear-toggle.kind-warrior {
      --item-color: #d64242;
      --item-soft: #ffe5e5;
    }

    .gear-toggle.kind-archer {
      --item-color: #198a57;
      --item-soft: #e0f6ea;
    }

    .gear-toggle.kind-mage {
      --item-color: #256fd2;
      --item-soft: #e5f0ff;
    }

    .gear-toggle.kind-healer {
      --item-color: #cb4f91;
      --item-soft: #ffe7f3;
    }

    .gear-toggle.kind-bard {
      --item-color: #b87900;
      --item-soft: #fff2c9;
    }

    .gear-toggle.kind-rogue {
      --item-color: #646b78;
      --item-soft: #eef1f5;
    }

    .gear-toggle[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--item-color) 48%, #ffffff);
      background: var(--item-soft);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--item-color) 16%, transparent) inset;
    }

    .gear-name {
      display: block;
      min-width: 0;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .gear-kind {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 1px;
    }

    .quick-controls {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      --stat-color: var(--blue);
      min-height: 76px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--stat-color);
      background: var(--surface);
    }

    .stat:nth-child(1) {
      --stat-color: var(--red);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 4px;
      font-size: clamp(21px, 2.6vw, 28px);
      font-weight: 850;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .stat-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .tabs,
    .class-types,
    .recipe-types {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      max-width: 100%;
      overflow-x: auto;
    }

    .tabs {
      width: fit-content;
      flex: 0 0 auto;
    }

    .build-types {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      align-content: flex-end;
      justify-content: flex-start;
      gap: 4px;
      flex: 0 1 auto;
      min-width: 0;
    }

    body.equipment-view-active .build-types {
      display: none;
    }

    .class-types {
      width: fit-content;
      min-width: 0;
      flex: 0 1 auto;
      align-self: flex-end;
      justify-content: flex-end;
    }

    .class-types.drakein-types .class-type {
      width: 58px;
      padding: 0 5px;
      text-align: center;
    }

    .recipe-types {
      width: fit-content;
      min-width: 0;
      flex: 0 1 auto;
      align-self: flex-end;
      justify-content: flex-end;
    }

    .recipe-types.job-types {
      display: grid;
      grid-template-columns: auto repeat(4, 58px);
      width: fit-content;
      justify-content: stretch;
      overflow-x: visible;
    }

    .tab,
    .class-type,
    .recipe-type {
      min-height: 28px;
      padding: 0 9px;
      border-radius: 6px;
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .recipe-types.job-types .recipe-type {
      width: 58px;
      padding: 0 6px;
      font-size: 13px;
      text-align: center;
    }

    .selector-label {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      padding: 0 6px;
      color: var(--red);
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
    }

    .tab.active,
    .class-type.active,
    .recipe-type.active {
      background: linear-gradient(90deg, var(--green-soft), var(--blue-2));
      color: var(--blue);
      border-color: color-mix(in srgb, var(--blue) 18%, var(--line));
      box-shadow: 0 1px 6px rgba(37, 111, 210, 0.12);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .table-wrap {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 6px 6px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 13px;
      font-weight: 820;
      text-align: center;
      background: linear-gradient(90deg, var(--green-soft), var(--blue-2));
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .material-name {
      font-weight: 820;
      color: var(--ink);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 780;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .pill.magic {
      background: var(--amber-2);
      color: var(--amber);
      border-color: #e2c8ad;
    }

    .pill.soul {
      background: var(--blue-2);
      color: var(--blue);
      border-color: #c8d9ec;
    }

    .material-icon {
      width: 32px;
      height: 32px;
      display: inline-block;
      border-radius: 8px;
      object-fit: contain;
      vertical-align: middle;
      box-shadow: 0 3px 10px rgba(37, 111, 210, 0.18);
    }

    .material-icon.small {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      flex: 0 0 auto;
    }

    .equipment-market {
      display: grid;
      gap: 10px;
    }

    .equipment-summary-head {
      display: flex;
      align-items: center;
      color: var(--ink);
      font-size: 14px;
      font-weight: 850;
    }

    .equipment-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .equipment-summary-card {
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .equipment-summary-label {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .equipment-summary-label strong {
      flex: 0 0 auto;
      color: var(--blue);
      font-weight: 850;
    }

    .equipment-summary-price {
      margin-top: 2px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .equipment-summary-name {
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .equipment-table {
      min-width: 0;
    }

    .equipment-table th,
    .equipment-table td {
      text-align: center;
    }

    .equipment-table th:first-child,
    .equipment-table td:first-child {
      text-align: left;
    }

    .equipment-cell {
      min-width: 0;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 5px;
    }

    .equipment-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: contain;
      background: #0c0f16;
      box-shadow: 0 1px 4px rgba(9, 16, 28, 0.16);
    }

    .equipment-price {
      color: var(--ink);
      font-size: 13px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .equipment-price.best {
      color: var(--red);
    }

    .equipment-name {
      margin-top: 1px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      overflow-wrap: normal;
    }

    .price-input,
    .owned-input {
      width: 66px;
      min-height: 28px;
      padding: 0 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .owned-input {
      width: 48px;
    }

    .owned-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-inline: auto;
    }

    .owned-stepper {
      display: grid;
      grid-template-rows: repeat(2, 14px);
      gap: 2px;
      flex: 0 0 auto;
    }

    .owned-step {
      display: grid;
      width: 17px;
      height: 14px;
      min-height: 0;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 8px;
      font-weight: 850;
      line-height: 1;
      cursor: pointer;
    }

    .owned-step:hover {
      border-color: #bcd4ef;
      background: var(--blue-2);
      color: var(--blue);
    }

    .price-change {
      display: inline-block;
      min-width: 52px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      line-height: 1;
      white-space: nowrap;
    }

    .price-change.up {
      color: var(--red);
    }

    .price-change.down {
      color: var(--blue);
    }

    .source-cell {
      max-width: none;
      white-space: normal;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    #view-materials th:nth-child(1) { width: 14%; }
    #view-materials th:nth-child(2) { width: 8%; }
    #view-materials th:nth-child(3) { width: 7%; }
    #view-materials th:nth-child(4) { width: 8%; }
    #view-materials th:nth-child(5) { width: 8.5%; }
    #view-materials th:nth-child(6) { width: 9%; }
    #view-materials th:nth-child(7) { width: 8%; }
    #view-materials th:nth-child(8) { width: 10%; }
    #view-materials th:nth-child(9) { width: 27.5%; }

    #view-materials table {
      min-width: 760px;
    }

    #view-materials th,
    #view-materials td,
    #view-materials td.num {
      text-align: center;
    }

    #view-materials td:nth-child(8),
    #view-materials td:nth-child(8).num {
      text-align: right;
    }

    #view-materials th:nth-child(5),
    #view-materials td:nth-child(5) {
      padding-left: 10px;
      padding-right: 10px;
    }

    #view-materials .material-name,
    #view-materials .material-icon,
    #view-materials .price-change {
      margin-inline: auto;
    }

    #view-materials .owned-input,
    #view-materials .price-input {
      display: block;
      margin-inline: auto;
      text-align: center !important;
      text-align-last: center;
    }

    #view-materials .owned-control .owned-input {
      margin-inline: 0;
    }

    #view-materials .price-input {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    #view-materials .price-input::-webkit-outer-spin-button,
    #view-materials .price-input::-webkit-inner-spin-button {
      margin: 0;
      -webkit-appearance: none;
    }

    .priority-list {
      display: grid;
      gap: 10px;
    }

    .priority-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .rank {
      --rank-bg: var(--green-soft);
      --rank-fg: var(--green);
      --rank-border: color-mix(in srgb, var(--rank-fg) 24%, #ffffff);
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid var(--rank-border);
      background: var(--rank-bg);
      color: var(--rank-fg);
      font-weight: 850;
    }

    .rank-1 { --rank-bg: #ffe5e5; --rank-fg: #c73d3d; --rank-border: #f0b1b1; }
    .rank-2 { --rank-bg: #fff1bf; --rank-fg: #a76700; --rank-border: #e8c366; }
    .rank-3 { --rank-bg: #dbeafe; --rank-fg: #2467c8; --rank-border: #a7c5f3; }
    .rank-4 { --rank-bg: #dff7e9; --rank-fg: #147c54; --rank-border: #9bd8bb; }
    .rank-5 { --rank-bg: #ffe2f2; --rank-fg: #bd3f85; --rank-border: #efa8cf; }
    .rank-6 { --rank-bg: #d9f6f8; --rank-fg: #127d88; --rank-border: #99d7dd; }
    .rank-7 { --rank-bg: #ece5ff; --rank-fg: #6850bf; --rank-border: #c7b9f4; }
    .rank-8 { --rank-bg: #f0efe6; --rank-fg: #796c35; --rank-border: #d8cf93; }
    .rank-9 { --rank-bg: #e9eef5; --rank-fg: #4d6078; --rank-border: #b8c4d2; }

    .rank-mini {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .priority-title {
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .priority-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .priority-qty {
      text-align: right;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .priority-report {
      margin-top: 10px;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .report-card {
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .report-card h3 {
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 850;
    }

    .report-lines {
      display: grid;
      gap: 6px;
    }

    .report-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .report-dungeon {
      font-weight: 850;
      overflow-wrap: anywhere;
    }

    .report-hint {
      margin-top: 1px;
      color: var(--muted);
      font-size: 12px;
    }

    .report-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 720;
      white-space: nowrap;
    }

    .report-empty {
      color: var(--muted);
      font-size: 13px;
    }

    .report-desc {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .note-box {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .note-box strong {
      display: block;
      margin-bottom: 6px;
    }

    .note-box p,
    .note-box li {
      color: var(--muted);
      font-size: 13px;
    }

    .note-box ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .recipe-card {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .recipe-card h3 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 14px;
      font-weight: 850;
      margin-bottom: 7px;
    }

    .recipe-card.is-inactive {
      opacity: 0.58;
    }

    .recipe-editor {
      display: grid;
      gap: 4px;
    }

    .recipe-edit-row {
      display: grid;
      grid-template-columns: minmax(96px, 1fr) 48px 64px;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
      border-top: 1px solid #edf1f0;
      font-size: 12px;
    }

    .recipe-edit-row:first-child {
      border-top: 0;
    }

    .recipe-material {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 780;
      overflow-wrap: anywhere;
    }

    .recipe-check {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .recipe-qty {
      width: 64px;
      min-height: 28px;
      padding: 0 6px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .recipe-qty:disabled {
      background: var(--surface-2);
      color: var(--muted);
    }

    .recipe-options {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .recipe-collapse-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      .title-row,
      .dashboard {
        grid-template-columns: 1fr;
      }

      .market-progress {
        width: min(310px, 52vw);
        min-width: 220px;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 20px, 1240px);
      }

      .panel-body {
        padding: 10px 12px 12px;
      }

      .control-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .tabs,
      .build-types {
        width: 100%;
      }

      .build-types {
        flex: 0 0 auto;
        align-items: flex-end;
        justify-content: flex-start;
      }

      .class-types,
      .recipe-types {
        width: fit-content;
        align-self: flex-end;
        justify-content: flex-end;
      }

      .recipe-types.job-types {
        grid-template-columns: auto repeat(4, 56px);
        width: fit-content;
      }

      .recipe-types.job-types .recipe-type {
        width: 56px;
        padding: 0 4px;
        font-size: 12px;
      }

      .class-types.drakein-types .class-type {
        width: 46px;
        padding: 0 3px;
        font-size: 12px;
      }

      .class-type,
      .recipe-type {
        padding: 0 6px;
        font-size: 12px;
      }

      .selector-label {
        padding: 0 3px;
      }

      .panel-title-row {
        align-items: center;
        flex-direction: row;
        flex-wrap: wrap;
      }

      .market-progress {
        width: min(250px, 52vw);
        min-width: 0;
      }

      .market-tools {
        justify-content: flex-end;
        min-width: 0;
      }

      .gear-grid,
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .recipe-grid {
        grid-template-columns: 1fr;
      }

      .gear-row {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .gear-toggle {
        height: 40px;
        min-height: 40px;
        padding: 7px 6px;
        font-size: 13px;
      }

      .gear-toggle[data-id="drakein-dualblade"] .gear-name {
        font-size: 11px;
      }

      .priority-row {
        grid-template-columns: 38px minmax(0, 1fr);
      }

      .priority-qty {
        grid-column: 2;
        text-align: left;
      }

      .report-grid {
        grid-template-columns: 1fr;
      }

      .report-line {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .report-meta {
        grid-column: 2;
        white-space: normal;
      }
    }

    @media (max-width: 760px) {
      .table-wrap {
        border: 1px solid var(--line);
        background: var(--surface);
      }

      #view-materials th,
      #view-materials td {
        padding: 5px 5px;
        font-size: 13px;
      }

      #view-materials .source-cell {
        font-size: 12px;
        line-height: 1.3;
      }

      #view-materials .material-icon {
        width: 26px;
        height: 26px;
      }

      #view-materials .price-input,
      #view-materials .owned-input {
        min-height: 26px;
      }

      #view-materials .price-change {
        min-width: 42px;
      }

      .equipment-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .equipment-table {
        min-width: 840px;
      }
    }
  </style>

    const state = loadState();

    function normalizeRecipe(recipe = {}) {
      const recipeWithAliases = { ...recipe };
      for (const [from, to] of Object.entries(materialAliases)) {
        if (Object.prototype.hasOwnProperty.call(recipeWithAliases, from)) {
          recipeWithAliases[to] = parseNumber(recipeWithAliases[to]) + parseNumber(recipeWithAliases[from]);
        }
      }
      const normalized = {};
      for (const name of allMaterialOrder) {
        const qty = Math.max(0, Math.floor(parseNumber(recipeWithAliases[name])));
        if (qty > 0) normalized[name] = qty;
      }
      return normalized;
    }

    function normalizePriceChanges(changes = {}) {
      const normalized = {};
      for (const name of allMaterialOrder) {
        const change = Number(changes[name]);
        if (Number.isFinite(change)) normalized[name] = change;
      }
      return normalized;
    }

    function getWeaponPreset(classType = "warrior") {
      return normalizeRecipe(weaponRecipePresets[classType] || weaponRecipePresets.warrior);

      const normalized = normalizeRecipe(recipe);
      const defaults = getDefaultDrakeinRecipe(item);
      for (const [name, qty] of Object.entries(defaults)) {

          weaponRecipesByClass: weaponRecipesByClass ? migrateWeaponRecipesByClass({ weaponRecipesByClass }) : getDefaultWeaponRecipesByClass(),

      const useEmptyFallback = options.useEmptyFallback !== false;

        state.selectedBySet = {
          haeyeon: Array.isArray(state.selected) ? state.selected : items.map((item) => item.id),
          drakein: drakeinItems.map((item) => item.id)
        };
      }
      const key = getSelectionKey();
      if (!Array.isArray(state.selectedBySet[key])) {
        state.selectedBySet[key] = getActiveItems().map((item) => item.id);
      }
      if (key === "haeyeon") state.selected = state.selectedBySet.haeyeon;
      if (useEmptyFallback && state.selectedBySet[key].length === 0 && getEmptySelectionFallbackMap()[key]) {
        return getDefaultActiveSelected();
      }
      return state.selectedBySet[key];
    }

    function setActiveSelected(nextSelected, options = {}) {
      if (!state.selectedBySet) state.selectedBySet = {};
      const key = getSelectionKey();
      const emptyFallback = !!options.emptyFallback && nextSelected.length === 0;
      state.selectedBySet[key] = nextSelected;
      getEmptySelectionFallbackMap()[key] = emptyFallback;
      if (key === "haeyeon") state.selected = nextSelected;
    }

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "-";
      return Math.round(value).toLocaleString("ko-KR");
    }

    function parseNumber(value) {
      const cleaned = String(value ?? "").replace(/[^\d.]/g, "");
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function getPriceChangeView(name) {
      const change = Number(state.priceChanges?.[name]);
      if (!Number.isFinite(change) || change === 0) {
        return { className: "flat", text: "-" };
      }
      if (change > 0) {
        return { className: "up", text: `▲ ${formatNumber(change)}` };
      }
      return { className: "down", text: `▼ ${formatNumber(Math.abs(change))}` };
    }

    function getRankClass(index) {
      return `rank-${(index % 9) + 1}`;
    }

    function getAggregates() {
      const activeMaterialOrder = getActiveMaterialOrder();
      const selected = getActiveSelected();
      const totals = Object.fromEntries(activeMaterialOrder.map((name) => [name, 0]));
      const selectedItems = getActiveItems().filter((item) => selected.includes(item.id));

      for (const item of selectedItems) {
        for (const [name, qty] of Object.entries(getRecipe(item))) {
          if (!Object.prototype.hasOwnProperty.call(totals, name)) totals[name] = 0;
          totals[name] += qty;
        }
      }

      return { totals, selectedItems };
    }

    function renderGear() {
      const grid = document.getElementById("gearGrid");
      const selected = getActiveSelected();
      grid.innerHTML = getActiveGearGroups().map((group) => {
        const groupItems = getActiveItems().filter((item) => item.kindClass === group.kindClass);
        const buttons = groupItems.map((item) => {
          const active = selected.includes(item.id);
          return `
            <button class="gear-toggle kind-${item.kindClass}" type="button" aria-pressed="${active}" data-id="${item.id}">
              <span class="gear-name">${item.label}</span>
            </button>
          `;
        }).join("");
        return `
          <section class="gear-group group-${group.kindClass}" aria-label="${group.label}">
            <div class="gear-group-label">${group.label}</div>
            <div class="gear-row">${buttons}</div>
          </section>
        `;
      }).join("");

      grid.querySelectorAll(".gear-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.dataset.id;
          const currentSelected = getActiveSelected();
          let nextSelected;
          if (currentSelected.includes(id)) {
            nextSelected = currentSelected.filter((selectedId) => selectedId !== id);
          } else {
            nextSelected = [...currentSelected, id];
          }
          setActiveSelected(nextSelected, { emptyFallback: false });
          if (isDrakein()) {
            const item = drakeinItems.find((entry) => entry.id === id);
            if (item) {
              state.drakeinClassType = item.kindClass;
              state.drakeinJobType = item.jobId;
            }
          }
          saveState();
          renderAll();
        });
      });
    }

    function renderMaterials() {
      const { totals } = getAggregates();
      const activeMaterialOrder = getActiveMaterialOrder();
      const body = document.getElementById("materialsBody");
      let totalCost = 0;
      let pricedShortage = 0;

      body.innerHTML = activeMaterialOrder.map((name) => {
        const required = totals[name] || 0;
        const owned = parseNumber(state.owned[name]);
        const shortage = Math.max(0, required - owned);
        const price = parseNumber(state.prices[name]);
        const cost = shortage * price;
        const meta = materials[name];
        const priceChange = getPriceChangeView(name);

        if (shortage > 0 && price > 0) {
          totalCost += cost;
          pricedShortage += shortage;
        }

        return `
          <tr>
            <td data-label="재료"><span class="material-name">${name}</span></td>
            <td data-label="분류"><img class="material-icon" src="${meta.icon}" alt="${name}" title="${name}"></td>
            <td class="num" data-label="필요">${formatNumber(required)}</td>
            <td class="num" data-label="보유">
              <div class="owned-control">
                <input class="owned-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${owned || ""}" data-owned="${name}" aria-label="${name} 보유 수량">
                <div class="owned-stepper">
                  <button class="owned-step" type="button" data-owned-step="1" data-owned-target="${name}" aria-label="${name} 보유 수량 1 증가">&#9650;</button>
                  <button class="owned-step" type="button" data-owned-step="-1" data-owned-target="${name}" aria-label="${name} 보유 수량 1 감소">&#9660;</button>
                </div>
              </div>
            </td>
            <td class="num" data-label="부족">${formatNumber(shortage)}</td>
            <td class="num" data-label="시세"><input class="price-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${price || ""}" data-price="${name}" aria-label="${name} 시세"></td>
            <td class="num" data-label="변동"><span class="price-change ${priceChange.className}" title="이전 저장 시세 대비">${priceChange.text}</span></td>
            <td class="num" data-label="구매 데카">${price > 0 ? formatNumber(cost) : "-"}</td>
            <td class="source-cell" data-label="수급처">${meta.source}</td>
          </tr>
        `;
      }).join("");

      document.getElementById("statCost").textContent = pricedShortage > 0 ? formatNumber(totalCost) : "-";
      document.getElementById("statCostSub").textContent = pricedShortage > 0 ? `${formatNumber(pricedShortage)}개 가격 반영` : "시세 입력 대기";

      body.querySelectorAll("[data-owned]").forEach((input) => {
        input.addEventListener("input", () => {
          state.owned[input.dataset.owned] = parseNumber(input.value);
          saveState();
        });
        input.addEventListener("change", () => {
          if (ownedStepperActive) return;
          renderAll({ keepGear: true });
        });
      });

      body.querySelectorAll("[data-owned-step]").forEach((button) => {
        button.addEventListener("pointerdown", () => {
          ownedStepperActive = true;
        });
        button.addEventListener("pointerup", () => {
          setTimeout(() => {
            ownedStepperActive = false;
          }, 0);
        });
        button.addEventListener("pointercancel", () => {
          ownedStepperActive = false;
        });
        button.addEventListener("click", () => {
          const input = button.closest(".owned-control")?.querySelector("[data-owned]");
          const name = button.dataset.ownedTarget;
          const step = Number(button.dataset.ownedStep);
          const current = parseNumber(input?.value ?? state.owned[name]);
          state.owned[name] = Math.max(0, Math.round(current + step));
          saveState();
          ownedStepperActive = false;
          renderAll({ keepGear: true });
        });
      });

      body.querySelectorAll("[data-price]").forEach((input) => {
        input.addEventListener("input", () => {
          state.prices[input.dataset.price] = parseNumber(input.value);
          if (!state.priceChanges) state.priceChanges = {};
          state.priceChanges[input.dataset.price] = 0;
          saveState();
        });
        input.addEventListener("change", () => {
          renderAll({ keepGear: true });
        });
      });

    }

    function renderPriority() {
      const { totals } = getAggregates();
      const rows = getActiveMaterialOrder().map((name) => {
        const required = totals[name] || 0;
        const owned = parseNumber(state.owned[name]);
        const shortage = Math.max(0, required - owned);
        const price = parseNumber(state.prices[name]);
        return {
          name,
          shortage,
          price,
          cost: shortage * price,
          ...materials[name]
        };
      }).filter((row) => row.shortage > 0);

      const hasPrices = rows.some((row) => row.price > 0);
      rows.sort((a, b) => {
        const aScore = hasPrices && a.price > 0 ? a.cost : a.shortage;
        const bScore = hasPrices && b.price > 0 ? b.cost : b.shortage;
        return bScore - aScore;
      });

      const list = document.getElementById("priorityList");
      const report = document.getElementById("priorityReport");
      if (!rows.length) {
        list.innerHTML = `<div class="note-box"><strong>부족 재료 없음</strong><p>현재 선택과 보유 수량 기준으로 추가 파밍이 필요하지 않습니다.</p></div>`;
        report.innerHTML = `
          <div class="report-desc">보유 수량이 충분합니다. 시세가 낮을 때 예비 재료만 확인하면 됩니다.</div>
        `;
        return;
      }

      list.innerHTML = rows.map((row, index) => {
        const action = row.type === "마력석" ? "매우 어려움 파밍 후보" : "반복 파밍 후보";
        const valueText = row.price > 0 ? `구매 ${formatNumber(row.cost)} 데카` : "시세 미입력";
        return `
          <div class="priority-row">
            <div class="rank ${getRankClass(index)}">${index + 1}</div>
            <div>
              <div class="priority-title">${row.source}</div>
              <div class="priority-meta">${row.name} 부족 ${formatNumber(row.shortage)}개 · ${action}</div>
            </div>
            <div class="priority-qty">${valueText}</div>
          </div>
        `;
      }).join("");

      const top = rows[0];
      const basis = hasPrices ? "가격이 있는 재료는 구매 비용을 우선 반영하고, 가격이 없는 재료는 부족 수량으로 보정했습니다." : "시세가 비어 있어 부족 수량 기준으로 정렬했습니다.";
      const rankedRows = rows.map((row, index) => ({ ...row, rankIndex: index }));
      const topRows = rankedRows.slice(0, 3);
      const magicRows = rankedRows.filter((row) => row.type === "마력석").slice(0, 3);
      const marketRows = rankedRows.filter((row) => row.price > 0).sort((a, b) => b.cost - a.cost).slice(0, 3);
      const renderReportLine = (row, metric) => `
        <div class="report-line">
          <div class="rank ${getRankClass(row.rankIndex)} rank-mini">${row.rankIndex + 1}</div>
          <div>
            <strong class="report-dungeon">${row.source}</strong>
            <div class="report-hint">${row.name} 부족 ${formatNumber(row.shortage)}개</div>
          </div>
          <div class="report-meta">${metric}</div>
        </div>
      `;

      report.innerHTML = `
        <div class="report-grid">
          <section class="report-card">
            <h3>우선 파밍</h3>
            <div class="report-lines">
              ${topRows.map((row) => renderReportLine(row, row.price > 0 ? `${formatNumber(row.cost)} 데카` : `${formatNumber(row.shortage)}개`)).join("")}
            </div>
            <p class="report-desc">상위 던전은 현재 선택 장비에서 병목이 큰 재료를 직접 줄이는 구간입니다. 시세가 비어 있으면 부족 수량을 우선 보고, 시세가 있으면 실제 데카 부담까지 함께 반영합니다.</p>
          </section>
          <section class="report-card">
            <h3>선택 기준</h3>
            <div class="report-lines">
              ${renderReportLine({ ...top, rankIndex: 0 }, top.price > 0 ? `구매 ${formatNumber(top.cost)} 데카` : `부족 ${formatNumber(top.shortage)}개`)}
            </div>
            <p class="report-desc">${basis} 같은 부족량이라면 여러 부위에 반복해서 들어가는 영혼석을 먼저 처리하고, 단일 부위 마력석은 필요한 장비가 확정된 뒤 보강하는 편이 낭비가 적습니다.</p>
          </section>
          <section class="report-card">
            <h3>마력석 선택</h3>
            <div class="report-lines">
              ${magicRows.length ? magicRows.map((row) => renderReportLine(row, row.price > 0 ? `${formatNumber(row.cost)} 데카` : `${formatNumber(row.shortage)}개`)).join("") : `<div class="report-empty">현재 선택 기준으로 부족한 마력석이 없습니다.</div>`}
            </div>
            <p class="report-desc">마력석은 종류별 수급처가 완전히 갈리기 때문에 한 던전 반복으로 해결되지 않습니다. 부족량이 남은 마력석만 골라 매우 어려움 던전을 도는 방식이 시간 대비 효율이 좋습니다.</p>
          </section>
          <section class="report-card">
            <h3>거래소 판단</h3>
            <div class="report-lines">
              ${marketRows.length ? marketRows.map((row) => renderReportLine(row, `${formatNumber(row.cost)} 데카`)).join("") : `<div class="report-empty">시세를 입력하거나 갱신하면 구매 비용 기준 판단을 표시합니다.</div>`}
            </div>
            <p class="report-desc">구매 데카가 낮은 재료는 거래소로 마감하면 제작 속도를 빠르게 당길 수 있습니다. 반대로 비용이 큰 재료는 파밍 우선순위에 남겨두고, 남은 소량만 거래소로 보충하는 식이 안정적입니다.</p>
          </section>
        </div>
      `;
    }

    function updateRecipeMaterial(itemId, materialName, qty) {
      if (isDrakein() && !state.drakeinRecipesByJob) state.drakeinRecipesByJob = getDefaultDrakeinRecipesByJob();
      const recipes = isDrakein()
        ? state.drakeinRecipesByJob
        : (itemId === "weapon" ? { weapon: getActiveWeaponRecipe() } : getActiveRecipes());
      if (!recipes[itemId]) recipes[itemId] = {};

      const numericQty = Math.max(0, Math.floor(parseNumber(qty)));
      if (numericQty > 0) {
        recipes[itemId][materialName] = numericQty;
      } else {
        delete recipes[itemId][materialName];
      }

      saveState();
      renderMaterials();
      renderPriority();
    }

    function renderRecipes() {
      const grid = document.getElementById("recipeGrid");
      const hideToggle = document.getElementById("hideUnusedRecipes");
      if (hideToggle) hideToggle.checked = !!state.hideUnusedRecipes;
      const activeSelected = getActiveSelected();
      const activeItems = [...getActiveItems()].sort((a, b) => {
        const activeJobId = isDrakein() ? `drakein-${getActiveDrakeinJobType()}` : "";
        if (a.id === activeJobId) return -1;
        if (b.id === activeJobId) return 1;
        const aSelected = activeSelected.includes(a.id);
        const bSelected = activeSelected.includes(b.id);
        if (aSelected !== bSelected) return aSelected ? -1 : 1;
        return 0;
      });
      const activeRecipeMaterialOrder = getRecipeMaterialOrder();
      const presetRecipes = isDrakein()
        ? getDefaultDrakeinRecipesByJob()
        : {
          ...getPresetRecipes(getActiveRecipeType()),
          weapon: getWeaponPreset(getActiveClassType())
        };
      grid.innerHTML = activeItems.map((item) => {
        const selected = activeSelected.includes(item.id);
        const recipe = getRecipe(item);
        const presetRecipe = presetRecipes[item.id] || {};
        const visibleMaterials = state.hideUnusedRecipes
          ? activeRecipeMaterialOrder.filter((name) => parseNumber(recipe[name]) > 0)
          : activeRecipeMaterialOrder;
        const lines = visibleMaterials.map((name) => {
          const qty = parseNumber(recipe[name]);
          const checked = qty > 0;
          const meta = materials[name];
          const defaultQty = parseNumber(presetRecipe[name]) || 1;

          return `
            <div class="recipe-edit-row">
              <span class="recipe-material"><img class="material-icon small" src="${meta.icon}" alt="${name}" title="${name}">${name}</span>
              <label class="recipe-check">
                <input type="checkbox" ${checked ? "checked" : ""} data-recipe-check data-item-id="${item.id}" data-material="${name}" data-default-qty="${defaultQty}">
                사용
              </label>
              <input class="recipe-qty" type="number" min="0" inputmode="numeric" value="${checked ? qty : ""}" ${checked ? "" : "disabled"} data-recipe-qty data-item-id="${item.id}" data-material="${name}" aria-label="${item.label} ${name} 수량">
            </div>
          `;
        }).join("");

        return `
          <article class="recipe-card ${selected ? "" : "is-inactive"}">
            <h3><span>${item.label}</span> <span class="pill">${item.kind}</span></h3>
            <div class="recipe-editor">${lines}</div>
          </article>
        `;
      }).join("");

      grid.querySelectorAll("[data-recipe-check]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          const row = checkbox.closest(".recipe-edit-row");
          const input = row.querySelector("[data-recipe-qty]");
          if (checkbox.checked) {
            const nextQty = parseNumber(input.value) || parseNumber(checkbox.dataset.defaultQty) || 1;
            input.disabled = false;
            input.value = nextQty;
            updateRecipeMaterial(checkbox.dataset.itemId, checkbox.dataset.material, nextQty);
          } else {
            input.value = "";
            input.disabled = true;
            updateRecipeMaterial(checkbox.dataset.itemId, checkbox.dataset.material, 0);
          }
        });
      });

      grid.querySelectorAll("[data-recipe-qty]").forEach((input) => {
        input.addEventListener("input", () => {
          const qty = parseNumber(input.value);
          const checkbox = input.closest(".recipe-edit-row").querySelector("[data-recipe-check]");
          checkbox.checked = qty > 0;
          updateRecipeMaterial(input.dataset.itemId, input.dataset.material, qty);
        });
      });
    }

    function getEquipmentSpecForJobSlot(job, slotId) {
      if (slotId === "weapon") return equipmentCatalog[`weapon-${job.id}`];
      if (slotId === "necklace") return equipmentCatalog["accessory-necklace"];
      if (slotId === "ring") return equipmentCatalog["accessory-ring"];
      const armorType = equipmentArmorTypeByClass[job.classId];
      return equipmentCatalog[`armor-${armorType}-${slotId}`];
    }

    function getEquipmentPrice(spec) {
      return parseNumber(state.equipmentPrices?.[spec.id]);
    }

    function getEquipmentName(spec) {
      const savedName = state.equipmentMarketNames?.[spec.id];
      if (!savedName || !String(savedName).includes("ZZ")) return spec.label;
      return savedName;
    }

    function getEquipmentCandidates(slotId) {
      if (slotId === "weapon") {
        return equipmentJobs.map((job) => getEquipmentSpecForJobSlot(job, slotId));
      }
      if (slotId === "necklace") return [equipmentCatalog["accessory-necklace"]];
      if (slotId === "ring") return [equipmentCatalog["accessory-ring"]];
      return Object.keys(equipmentArmorKeywords).map((armorType) => equipmentCatalog[`armor-${armorType}-${slotId}`]);
    }

    function getLowestEquipment(slotId) {
      return getEquipmentCandidates(slotId)
        .map((spec) => ({ spec, price: getEquipmentPrice(spec) }))
        .filter(({ price }) => price > 0)
        .sort((a, b) => a.price - b.price)[0] || null;
    }

    function getEquipmentSummaryQualifier(slotId, spec) {
      if (!spec) return "";
      if (slotId === "weapon") {
        const job = equipmentJobs.find((entry) => getEquipmentSpecForJobSlot(entry, "weapon")?.id === spec.id);
        return job?.label || "";
      }
      if (["helmet", "armor", "pants", "gloves", "shoes"].includes(slotId)) {
        const armorType = spec.id.split("-")[1];
        return equipmentArmorLabels[armorType] || "";
      }
      return "";
    }

    function renderEquipmentCell(spec, lowest, options = {}) {
      const price = getEquipmentPrice(spec);
      const name = getEquipmentName(spec);
      const isBest = lowest && lowest.spec.id === spec.id && price > 0 && options.highlight !== false;
      return `
        <div class="equipment-cell" title="${name}">
          <img class="equipment-icon" src="${spec.icon}" alt="${name}">
          <div>
            <div class="equipment-price ${isBest ? "best" : ""}">${price > 0 ? formatNumber(price) : "-"}</div>
            <div class="equipment-name">${name}</div>
          </div>
        </div>
      `;
    }

    function renderEquipmentMarket() {
      const container = document.getElementById("equipmentMarket");
      if (!container) return;

      const lowestBySlot = Object.fromEntries(equipmentSlots.map((slot) => [slot.id, getLowestEquipment(slot.id)]));
      const summary = equipmentSlots.map((slot) => {
        const lowest = lowestBySlot[slot.id];
        const name = lowest ? getEquipmentName(lowest.spec) : "시세 미반영";
        const qualifier = lowest ? getEquipmentSummaryQualifier(slot.id, lowest.spec) : "";
        const summaryName = qualifier ? `(${qualifier}) ${name}` : name;
        return `
          <article class="equipment-summary-card">
            <div class="equipment-summary-label"><strong>${slot.label}</strong><span class="equipment-summary-name">${summaryName}</span></div>
            <div class="equipment-summary-price">${lowest ? formatNumber(lowest.price) : "-"}</div>
          </article>
        `;
      }).join("");

      const rows = equipmentJobs.map((job, rowIndex) => {
        const armorType = equipmentArmorTypeByClass[job.classId];
        const armorLabel = equipmentArmorLabels[armorType] || "";
        const cells = equipmentSlots.map((slot) => {
          const spec = getEquipmentSpecForJobSlot(job, slot.id);
          const accessoryRepeat = (slot.id === "necklace" || slot.id === "ring") && rowIndex > 0;
          return `<td data-label="${slot.label}">${renderEquipmentCell(spec, lowestBySlot[slot.id], { highlight: !accessoryRepeat })}</td>`;
        }).join("");
        return `
          <tr>
            <td data-label="직업"><strong>${job.label}</strong><div class="equipment-name">${armorLabel}</div></td>
            ${cells}
          </tr>
        `;
      }).join("");

      container.innerHTML = `
        <div class="equipment-summary-head">
          <span>현재 최저가</span>
        </div>
        <div class="equipment-summary-grid">${summary}</div>
        <div class="table-wrap">
          <table class="equipment-table">
            <thead>
              <tr>
                <th>직업</th>
                ${equipmentSlots.map((slot) => `<th>${slot.label}</th>`).join("")}
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;

      if (state.equipmentPriceStamp) {
        setEquipmentMarketProgress(equipmentMarketItems.length, equipmentMarketItems.length, formatMarketTimestamp(state.equipmentPriceStamp), "ok");
      } else {
        setEquipmentMarketProgress(0, equipmentMarketItems.length, "장비 시세 갱신 대기");
      }
    }

    function setStatus(kind, message) {
      const status = document.getElementById("marketStatus");
      if (!status) return;
      const dot = status.querySelector(".dot");
      dot.className = `dot ${kind || ""}`;
      status.querySelector("span:last-child").textContent = message;
    }

    function setProgress(current, total, message, kind, ids) {
      const progress = document.getElementById(ids.progress);
      const text = document.getElementById(ids.text);
      const count = document.getElementById(ids.count);
      const bar = document.getElementById(ids.bar);
      if (!progress || !text || !count || !bar) return;

      const safeTotal = Math.max(1, total);
      const safeCurrent = Math.max(0, Math.min(safeTotal, current));
      const percent = Math.round((safeCurrent / safeTotal) * 100);
      progress.className = `market-progress ${kind || ""}`.trim();
      text.textContent = message;
      count.textContent = `${safeCurrent}/${safeTotal}`;
      bar.style.width = `${percent}%`;
    }

    function setMarketProgress(current, total = getActiveMaterialOrder().length, message = "시세 갱신 대기", kind = "") {
      setProgress(current, total, message, kind, {
        progress: "marketProgress",
        text: "marketProgressText",
        count: "marketProgressCount",
        bar: "marketProgressBar"
      });
    }

    function setEquipmentMarketProgress(current, total = equipmentMarketItems.length, message = "장비 시세 갱신 대기", kind = "") {
      setProgress(current, total, message, kind, {
        progress: "equipmentMarketProgress",
        text: "equipmentMarketProgressText",
        count: "equipmentMarketProgressCount",
        bar: "equipmentMarketProgressBar"
      });
    }

    function formatMarketTimestamp(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "시세 갱신 대기" : date.toLocaleString("ko-KR");
    }

    function renderTabs() {
      const syncActiveView = () => {
        const activeTab = document.querySelector(".tab.active");
        document.body.classList.toggle("equipment-view-active", activeTab?.dataset.view === "equipment");
      };
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
          document.querySelectorAll(".view").forEach((view) => view.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(`view-${tab.dataset.view}`).classList.add("active");
          syncActiveView();
        });
      });
      syncActiveView();
    }

    function renderGearSetTabs() {
      document.querySelectorAll("[data-gear-set]").forEach((button) => {
        const active = button.dataset.gearSet === state.gearSet;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
        button.onclick = () => {
          const nextSet = button.dataset.gearSet;
          if (!gearSetTypes.some(({ id }) => id === nextSet) || state.gearSet === nextSet) return;
          state.gearSet = nextSet;
          getActiveSelected();
          saveState();
          renderAll();
          if (state.priceStamp) {
            setMarketProgress(getActiveMaterialOrder().length, getActiveMaterialOrder().length, formatMarketTimestamp(state.priceStamp), "ok");
          } else {
            setMarketProgress(0, getActiveMaterialOrder().length, "시세 갱신 대기");
          }
          const label = gearSetTypes.find(({ id }) => id === nextSet)?.label || "장비";
          setStatus("ok", `${label} 제작 목표로 계산했습니다.`);
        };
      });
    }

    function renderBuildControls() {
      const classBox = document.getElementById("classTypes");
      const recipeBox = document.getElementById("recipeTypes");
      const activeClassTypes = drakeinClassTypes;
      const activeClassType = getActiveClassType();
      classBox.classList.add("drakein-types");

      classBox.innerHTML = `
        <span class="selector-label">계열</span>
        ${activeClassTypes.map(({ id, label }) => `
          <button class="class-type ${id === activeClassType ? "active" : ""}" type="button" data-class-type="${id}" aria-pressed="${id === activeClassType}">${label}</button>
        `).join("")}
      `;

      classBox.querySelectorAll("[data-class-type]").forEach((button) => {
        button.addEventListener("click", () => {
          const nextType = button.dataset.classType;
          if (!activeClassTypes.some(({ id }) => id === nextType)) return;
          if (isDrakein()) {
            if (nextType === getActiveClassType() && getActiveSelected({ useEmptyFallback: false }).length > 0) return;
            state.drakeinClassType = nextType;
            const firstJob = drakeinJobsByClass[nextType][0];
            state.drakeinJobType = firstJob.id;
            setActiveSelected([`drakein-${firstJob.id}`]);
          } else {
            state.classType = nextType;
            state.recipeType = haeyeonRecipeTypeByClass[nextType] || state.recipeType;
            getActiveWeaponRecipe();
            getActiveRecipes();
          }
          saveState();
          renderAll();
          const label = activeClassTypes.find(({ id }) => id === nextType)?.label || "계열";
          setStatus("ok", `${label} 계열 제작식으로 계산했습니다.`);
        });
      });

      if (isDrakein()) {
        const activeJobType = getActiveDrakeinJobType();
        const jobs = drakeinJobsByClass[activeClassType] || drakeinJobsByClass.warrior;
        recipeBox.classList.add("job-types");
        recipeBox.setAttribute("aria-label", "직업");
        recipeBox.innerHTML = `
          <span class="selector-label">직업</span>
          ${jobs.map(({ id, label }) => `
            <button class="recipe-type ${id === activeJobType ? "active" : ""}" type="button" data-drakein-job-type="${id}" aria-pressed="${id === activeJobType}">${label}</button>
          `).join("")}
        `;
        recipeBox.querySelectorAll("[data-drakein-job-type]").forEach((button) => {
          button.addEventListener("click", () => {
            const nextJob = button.dataset.drakeinJobType;
            if (!jobs.some(({ id }) => id === nextJob) || state.drakeinJobType === nextJob) return;
            state.drakeinJobType = nextJob;
            setActiveSelected([`drakein-${nextJob}`]);
            saveState();
            renderAll();
            const label = jobs.find(({ id }) => id === nextJob)?.label || "직업";
            setStatus("ok", `${label} 제작 목표로 계산했습니다.`);
          });
        });
      } else {
        recipeBox.classList.remove("job-types");
        recipeBox.setAttribute("aria-label", "방어구");
        recipeBox.innerHTML = `
          <span class="selector-label">방어구</span>
          ${recipeTypes.map(({ id, label }) => `
            <button class="recipe-type ${id === getActiveRecipeType() ? "active" : ""}" type="button" data-recipe-type="${id}" aria-pressed="${id === getActiveRecipeType()}">${label}</button>
          `).join("")}
        `;
        recipeBox.querySelectorAll("[data-recipe-type]").forEach((button) => {
          button.addEventListener("click", () => {
            const nextType = button.dataset.recipeType;
            if (!recipeTypes.some(({ id }) => id === nextType)) return;
            state.recipeType = nextType;
            state.classType = haeyeonClassTypeByRecipe[nextType] || state.classType;
            getActiveWeaponRecipe();
            getActiveRecipes();
            saveState();
            renderAll({ keepGear: true });
            const label = recipeTypes.find(({ id }) => id === nextType)?.label || "제작식";
            setStatus("ok", `${label} 제작식으로 계산했습니다.`);
          });
        });
      }
    }

    function renderAll(options = {}) {
      renderGearSetTabs();
      renderBuildControls();
      if (!options.keepGear) renderGear();
      renderMaterials();
      renderPriority();
      renderRecipes();
      renderEquipmentMarket();
    }

    function buildMarketApiUrl(itemName, options = {}) {
      const parentCategory = Object.prototype.hasOwnProperty.call(options, "parentCategory") ? options.parentCategory : "아이템";
      const params = new URLSearchParams({
        search: itemName,
        sort: "price_asc",
        limit: String(options.limit || 10),
        offset: "0"
      });
      if (parentCategory) params.set("parent_category", parentCategory);
      return `${MARKET_API_URL}?${params.toString()}`;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store", credentials: "omit" });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    async function fetchText(url) {
      const response = await fetch(url, { cache: "no-store", credentials: "omit" });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.text();
    }

    function parseReaderJson(text) {
      const marker = "Markdown Content:";
      const body = text.includes(marker) ? text.slice(text.indexOf(marker) + marker.length) : text;
      const start = body.search(/[{[]/);
      const end = Math.max(body.lastIndexOf("}"), body.lastIndexOf("]"));
      if (start < 0 || end < start) throw new Error("JSON 본문 없음");
      return JSON.parse(body.slice(start, end + 1).trim());
    }

    function getMarketQueries(itemSpec) {
      if (typeof itemSpec === "string") return [itemSpec];
      return itemSpec.queries?.length ? itemSpec.queries : [itemSpec.label];
    }

    function getMarketLabel(itemSpec) {
      return typeof itemSpec === "string" ? itemSpec : itemSpec.label;
    }

    function getMarketParentCategory(itemSpec) {
      if (typeof itemSpec === "string") return "아이템";
      return Object.prototype.hasOwnProperty.call(itemSpec, "parentCategory") ? itemSpec.parentCategory : null;
    }

    function pickMarketItem(data, itemSpec) {
      const list = Array.isArray(data?.items) ? data.items : [];
      const queries = getMarketQueries(itemSpec);
      const keywords = typeof itemSpec === "string" ? [] : (itemSpec.keywords || []);
      return list.find((item) => queries.some((query) => item.name === query))
        || list.find((item) => keywords.length && keywords.every((keyword) => String(item.name || "").includes(keyword)))
        || list.find((item) => queries.some((query) => String(item.name || "").includes(query)))
        || null;
    }

    async function fetchMarketItem(itemSpec, mode) {
      for (const query of getMarketQueries(itemSpec)) {
        const apiUrl = buildMarketApiUrl(query, { parentCategory: getMarketParentCategory(itemSpec) });
        const data = mode === "proxy"
          ? parseReaderJson(await fetchText(`${MARKET_PROXY_URL}${apiUrl}`))
          : await fetchJson(apiUrl);
        const item = pickMarketItem(data, itemSpec);
        if (item && Number.isFinite(Number(item.min_price))) return item;
      }
      return null;
    }

    async function fetchMarketList(search, mode, options = {}) {
      const apiUrl = buildMarketApiUrl(search, {
        parentCategory: Object.prototype.hasOwnProperty.call(options, "parentCategory") ? options.parentCategory : null,
        limit: options.limit || 120
      });
      const data = mode === "proxy"
        ? parseReaderJson(await fetchText(`${MARKET_PROXY_URL}${apiUrl}`))
        : await fetchJson(apiUrl);
      return Array.isArray(data?.items) ? data.items : [];
    }

    async function fetchMarketPrices(mode, offset = 0, total = getActiveMaterialOrder().length) {
      const found = {};
      const missing = [];
      const activeMaterialOrder = getActiveMaterialOrder();

      for (const [index, name] of activeMaterialOrder.entries()) {
        setMarketProgress(offset + index, total, `확인 중: ${name}`);
        try {
          const item = await fetchMarketItem(name, mode);
          if (item) {
            found[name] = Number(item.min_price);
          } else {
            missing.push(name);
          }
        } catch (error) {
          if (mode === "direct") throw error;
          missing.push(name);
        } finally {
          setMarketProgress(offset + index + 1, total, `확인 중: ${name}`);
        }
      }

      return { found, missing };
    }

    async function fetchEquipmentPrices(mode, offset = 0, total = equipmentMarketItems.length) {
      const found = {};
      const names = {};
      const missing = [];
      const marketItems = [];
      const seenIds = new Set();

      const addMarketItems = (items) => {
        items.forEach((item) => {
          const key = item.id || item.name;
          if (seenIds.has(key)) return;
          seenIds.add(key);
          marketItems.push(item);
        });
      };

      setEquipmentMarketProgress(offset, total, "장비 목록 확인 중");

      addMarketItems(await fetchMarketList("해연", mode, { parentCategory: null, limit: 120 }));
      try {
        addMarketItems(await fetchMarketList("꽃잎 접부채", mode, { parentCategory: null, limit: 20 }));
      } catch (error) {
        if (mode === "direct") throw error;
      }

      for (const [index, spec] of equipmentMarketItems.entries()) {
        setEquipmentMarketProgress(offset + index, total, `장비 확인 중: ${spec.label}`);
        try {
          const item = pickMarketItem({ items: marketItems }, spec) || await fetchMarketItem(spec, mode);
          if (item) {
            found[spec.id] = Number(item.min_price);
            names[spec.id] = item.name || spec.label;
          } else {
            missing.push(spec.label);
          }
        } catch (error) {
          if (mode === "direct") throw error;
          missing.push(spec.label);
        } finally {
          setEquipmentMarketProgress(offset + index + 1, total, `장비 확인 중: ${spec.label}`);
        }
      }

      return { found, names, missing };
    }

    async function refreshMarketPrices() {
      const button = document.getElementById("refreshMarket");
      const errors = [];
      const activeMaterialOrder = getActiveMaterialOrder();
      const refreshTotal = activeMaterialOrder.length;
      const previousPrices = Object.fromEntries(activeMaterialOrder.map((name) => [name, parseNumber(state.prices[name])]));
      button.disabled = true;
      setMarketProgress(0, refreshTotal, "재료 시세 갱신 시작");

      try {
        let result;

        try {
          result = await fetchMarketPrices("direct", 0, refreshTotal);
        } catch (error) {
          errors.push(`직접 호출: ${error.message}`);
          result = await fetchMarketPrices("proxy", 0, refreshTotal);
        }

        const entries = Object.entries(result.found);
        if (!entries.length) {
          throw new Error("대상 재료 시세를 찾지 못함");
        }

        if (!state.priceChanges) state.priceChanges = {};

        for (const name of activeMaterialOrder) {
          if (Object.prototype.hasOwnProperty.call(result.found, name)) {
            const price = Number(result.found[name]);
            const previous = previousPrices[name];
            state.prices[name] = price;
            state.priceChanges[name] = previous > 0 ? price - previous : 0;
          } else {
            state.priceChanges[name] = 0;
          }
        }

        state.priceStamp = new Date().toISOString();
        saveState();
        renderAll();

        if (result.missing.length) {
          setMarketProgress(refreshTotal, refreshTotal, formatMarketTimestamp(state.priceStamp), "warn");
        } else {
          setMarketProgress(refreshTotal, refreshTotal, formatMarketTimestamp(state.priceStamp), "ok");
        }
      } catch (error) {
        errors.push(error.message);
        setMarketProgress(refreshTotal, refreshTotal, "자동 갱신 실패", "error");
      } finally {
        button.disabled = false;
      }
    }

    async function refreshEquipmentMarketPrices() {
      const button = document.getElementById("refreshEquipmentMarket");
      const refreshTotal = equipmentMarketItems.length;
      if (button) button.disabled = true;
      setEquipmentMarketProgress(0, refreshTotal, "장비 시세 갱신 시작");

      try {
        let result;

        try {
          result = await fetchEquipmentPrices("direct", 0, refreshTotal);
        } catch (error) {
          result = await fetchEquipmentPrices("proxy", 0, refreshTotal);
        }

        const entries = Object.entries(result.found);
        if (!entries.length) {
          throw new Error("대상 장비 시세를 찾지 못함");
        }

        state.equipmentPrices = {
          ...(state.equipmentPrices || {}),
          ...result.found
        };
        state.equipmentMarketNames = {
          ...(state.equipmentMarketNames || {}),
          ...result.names
        };
        state.equipmentPriceStamp = new Date().toISOString();
        saveState();
        renderAll();

        if (result.missing.length) {
          setEquipmentMarketProgress(refreshTotal, refreshTotal, formatMarketTimestamp(state.equipmentPriceStamp), "warn");
        } else {
          setEquipmentMarketProgress(refreshTotal, refreshTotal, formatMarketTimestamp(state.equipmentPriceStamp), "ok");
        }
      } catch (error) {
        setEquipmentMarketProgress(refreshTotal, refreshTotal, "장비 갱신 실패", "error");
      } finally {
        const nextButton = document.getElementById("refreshEquipmentMarket");
        if (nextButton) nextButton.disabled = false;
      }
    }

    document.getElementById("selectAll").addEventListener("click", () => {
      setActiveSelected(getActiveItems().map((item) => item.id), { emptyFallback: false });
      saveState();
      renderAll();
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      setActiveSelected([], { emptyFallback: false });
      saveState();
      renderAll();
    });

    document.getElementById("refreshMarket").addEventListener("click", refreshMarketPrices);
    document.getElementById("refreshEquipmentMarket").addEventListener("click", refreshEquipmentMarketPrices);

    document.getElementById("hideUnusedRecipes").addEventListener("change", (event) => {
      state.hideUnusedRecipes = event.target.checked;
      saveState();
      renderRecipes();
    });

    if (state.priceStamp) {
      setMarketProgress(getActiveMaterialOrder().length, getActiveMaterialOrder().length, formatMarketTimestamp(state.priceStamp), "ok");
    } else {
      setMarketProgress(0, getActiveMaterialOrder().length, "시세 갱신 대기");
    }

    renderTabs();
    renderAll();
  </script>
  <script>
    (function () {
      var lastSent = 0;
      var raf = null;

      function measureVisibleHeight() {
        if (!document.body) return 0;
        var maxBottom = 0;
        Array.prototype.forEach.call(document.body.children, function (element) {
          if (element.tagName === "SCRIPT") return;
          var style = window.getComputedStyle(element);
          if (style.display === "none" || style.position === "fixed") return;
          var rect = element.getBoundingClientRect();
          maxBottom = Math.max(maxBottom, rect.bottom + window.scrollY);
        });
        return Math.ceil(maxBottom);
      }

      function postHeight() {
        var h = measureVisibleHeight();
        if (h < 200 || h === lastSent) return; // ignore transient 0/near-0 layout reads
        lastSent = h;
        window.parent.postMessage({ type: "mabinogi-planner-resize", height: h }, "*");
      }
      function schedulePostHeight() {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () {
          postHeight();
          setTimeout(postHeight, 80);
          setTimeout(postHeight, 220);
        });
      }
      window.mabinogiPlannerPostHeight = schedulePostHeight;
      window.addEventListener("load", function () {
        schedulePostHeight();
        [100, 300, 800, 1500, 3000].forEach(function (delay) {
          setTimeout(schedulePostHeight, delay);
        });
      });
      window.addEventListener("resize", schedulePostHeight);
      document.addEventListener("click", function (event) {
        if (event.target.closest(".tab, .gear-toggle, .gear-set-tab, .class-type, .recipe-type, #selectAll, #clearAll, #hideUnusedRecipes")) {
          schedulePostHeight();
        }
      });
      if (window.ResizeObserver) {
        new ResizeObserver(function () {
          schedulePostHeight();
        }).observe(document.body);
      } else {
        setInterval(schedulePostHeight, 500);
      }
    })();
  </script>
</body>
